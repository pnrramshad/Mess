<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Invoicify - UAE Billing & Inventory System</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0284c7',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase Compatibility Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    @media print {
      body * { visibility: hidden; }
      #printable-area, #printable-area * { visibility: visible; }
      #printable-area {
        position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 12px;
        color: #000 !important; background: #fff !important;
      }
      .no-print { display: none !important; }
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Firebase Credentials for tharavad336
    const firebaseConfig = {
      apiKey: "AIzaSyDc113ArrZa-bBCvKl-3UEwi4pIAdtwmIA",
      authDomain: "tharavad336.firebaseapp.com",
      projectId: "tharavad336",
      storageBucket: "tharavad336.firebasestorage.app",
      messagingSenderId: "124534840254",
      appId: "1:124534840254:web:825d9c694eea1934d977ef",
      measurementId: "G-XZ92F73DVT"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    const INITIAL_PRODUCTS = [
      { id: 'p1', name: 'Premium Coffee Beans (1kg)', code: 'PRD-01', price: 85.00, vatRate: 5, stock: 42, category: 'Beverages' },
      { id: 'p2', name: 'Organic Almond Milk 1L', code: 'PRD-02', price: 18.50, vatRate: 5, stock: 15, category: 'Beverages' },
      { id: 'p3', name: 'Espresso Machine Cleaning Powder', code: 'PRD-03', price: 45.00, vatRate: 5, stock: 8, category: 'Maintenance' },
      { id: 'p4', name: 'Takeaway Cup 12oz (Pack of 50)', code: 'PRD-04', price: 32.00, vatRate: 5, stock: 120, category: 'Packaging' },
    ];

    const INITIAL_CUSTOMERS = [
      { id: 'c1', name: 'Al Maskoor Trading LLC', phone: '+971 50 123 4567', email: 'billing@almaskoor.ae', trn: '100239482700003', address: 'Business Bay, Dubai' },
      { id: 'c2', name: 'Walk-in Customer', phone: 'N/A', email: 'N/A', trn: 'N/A', address: 'Abu Dhabi, UAE' }
    ];

    function App() {
      const [theme, setTheme] = useState(localStorage.getItem('theme') || 'light');
      const [activeTab, setActiveTab] = useState('dashboard');
      const [syncStatus, setSyncStatus] = useState('Connecting...');

      // Company Profile
      const [company, setCompany] = useState(() => {
        const local = localStorage.getItem('inv_company');
        return local ? JSON.parse(local) : {
          name: 'FLOURISH CAFE & TRADING LLC',
          trn: '100392817400003',
          phone: '+971 4 888 9999',
          email: 'info@flourish.ae',
          address: 'Sheikh Zayed Road, Dubai, UAE',
          currency: 'AED',
          vatPercent: 5
        };
      });

      // Data States with LocalStorage initializers
      const [products, setProducts] = useState(() => {
        const local = localStorage.getItem('inv_products');
        return local ? JSON.parse(local) : INITIAL_PRODUCTS;
      });
      const [customers, setCustomers] = useState(() => {
        const local = localStorage.getItem('inv_customers');
        return local ? JSON.parse(local) : INITIAL_CUSTOMERS;
      });
      const [invoices, setInvoices] = useState(() => {
        const local = localStorage.getItem('inv_invoices');
        return local ? JSON.parse(local) : [];
      });

      // Cart State
      const [cart, setCart] = useState([]);
      const [selectedCustomer, setSelectedCustomer] = useState(INITIAL_CUSTOMERS[0]);
      const [discount, setDiscount] = useState(0);
      const [discountType, setDiscountType] = useState('amount');
      const [paymentMethod, setPaymentMethod] = useState('cash');
      const [searchProduct, setSearchProduct] = useState('');

      // Modals
      const [activeInvoice, setActiveInvoice] = useState(null);
      const [showPrintModal, setShowPrintModal] = useState(false);
      const [searchInvoice, setSearchInvoice] = useState('');

      const [showProdModal, setShowProdModal] = useState(false);
      const [newProd, setNewProd] = useState({ name: '', code: '', price: '', stock: '', category: 'General' });

      const [showCustModal, setShowCustModal] = useState(false);
      const [newCust, setNewCust] = useState({ name: '', trn: '', phone: '', email: '', address: '' });

      useEffect(() => {
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        localStorage.setItem('theme', theme);
      }, [theme]);

      // --- REALTIME FIRESTORE SYNC LISTENERS ---

      // 1. Sync Invoices
      useEffect(() => {
        const unsubInvoices = db.collection('invoices').onSnapshot(
          (snapshot) => {
            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            if (data.length > 0) {
              setInvoices(data);
              localStorage.setItem('inv_invoices', JSON.stringify(data));
            }
            setSyncStatus('Cloud Connected');
          },
          (err) => {
            console.error("Invoices sync error:", err);
            setSyncStatus('Offline Mode');
          }
        );

        // 2. Sync Customers
        const unsubCustomers = db.collection('customers').onSnapshot(
          (snapshot) => {
            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            if (data.length > 0) {
              setCustomers(data);
              localStorage.setItem('inv_customers', JSON.stringify(data));
              // Update selected customer reference if exists
              setSelectedCustomer(prev => data.find(c => c.id === prev?.id) || data[0]);
            }
          },
          (err) => console.error("Customers sync error:", err)
        );

        // 3. Sync Products
        const unsubProducts = db.collection('products').onSnapshot(
          (snapshot) => {
            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            if (data.length > 0) {
              setProducts(data);
              localStorage.setItem('inv_products', JSON.stringify(data));
            }
          },
          (err) => console.error("Products sync error:", err)
        );

        // 4. Sync Company Info
        const unsubCompany = db.collection('settings').doc('company').onSnapshot(
          (doc) => {
            if (doc.exists) {
              setCompany(doc.data());
              localStorage.setItem('inv_company', JSON.stringify(doc.data()));
            }
          },
          (err) => console.error("Company sync error:", err)
        );

        return () => {
          unsubInvoices();
          unsubCustomers();
          unsubProducts();
          unsubCompany();
        };
      }, []);

      // LocalStorage Backup Fallbacks
      useEffect(() => { localStorage.setItem('inv_company', JSON.stringify(company)); }, [company]);
      useEffect(() => { localStorage.setItem('inv_products', JSON.stringify(products)); }, [products]);
      useEffect(() => { localStorage.setItem('inv_customers', JSON.stringify(customers)); }, [customers]);
      useEffect(() => { localStorage.setItem('inv_invoices', JSON.stringify(invoices)); }, [invoices]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      // Cart Dynamic Calculations
      const cartCalculations = useMemo(() => {
        const subtotal = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
        let discAmount = 0;
        if (discountType === 'amount') {
          discAmount = Math.min(discount, subtotal);
        } else {
          discAmount = (subtotal * Math.min(discount, 100)) / 100;
        }
        const netTaxable = Math.max(0, subtotal - discAmount);
        const vatTotal = netTaxable * (company.vatPercent / 100);
        const grandTotal = netTaxable + vatTotal;

        return { subtotal, discAmount, netTaxable, vatTotal, grandTotal };
      }, [cart, discount, discountType, company.vatPercent]);

      // Cart Management
      const addToCart = (product) => {
        if (product.stock <= 0) {
          alert('Warning: Product is out of stock!');
          return;
        }
        const existing = cart.find(i => i.id === product.id);
        if (existing) {
          if (existing.qty >= product.stock) {
            alert(`Stock limit (${product.stock}) reached.`);
            return;
          }
          setCart(cart.map(i => i.id === product.id ? { ...i, qty: i.qty + 1 } : i));
        } else {
          setCart([...cart, { ...product, qty: 1 }]);
        }
      };

      const updateCartQty = (id, newQty) => {
        const prod = products.find(p => p.id === id);
        if (newQty > prod.stock) {
          alert(`Stock limit reached! Max available: ${prod.stock}`);
          return;
        }
        if (newQty <= 0) {
          setCart(cart.filter(i => i.id !== id));
        } else {
          setCart(cart.map(i => i.id === id ? { ...i, qty: newQty } : i));
        }
      };

      // Checkout & Save Invoice
      const handleCheckout = async () => {
        if (cart.length === 0) {
          alert("Please add items to invoice before checking out.");
          return;
        }

        const invoiceNum = `INV-${new Date().getFullYear()}-${String(invoices.length + 1).padStart(4, '0')}`;
        const newInvoice = {
          invoiceNumber: invoiceNum,
          date: new Date().toISOString(),
          customer: selectedCustomer,
          items: cart,
          company: company,
          subtotal: cartCalculations.subtotal,
          discount: cartCalculations.discAmount,
          taxableAmount: cartCalculations.netTaxable,
          vatAmount: cartCalculations.vatTotal,
          vatRate: company.vatPercent,
          grandTotal: cartCalculations.grandTotal,
          paymentMethod: paymentMethod,
          status: 'Paid'
        };

        // Deduct inventory locally & update Firestore docs if product exists
        const updatedProducts = products.map(p => {
          const cartItem = cart.find(c => c.id === p.id);
          if (cartItem) {
            const newStock = Math.max(0, p.stock - cartItem.qty);
            if (p.id && !p.id.startsWith('p1') && !p.id.startsWith('p2') && !p.id.startsWith('p3') && !p.id.startsWith('p4')) {
              db.collection('products').doc(p.id).update({ stock: newStock }).catch(e => console.error(e));
            }
            return { ...p, stock: newStock };
          }
          return p;
        });

        setProducts(updatedProducts);
        setInvoices([newInvoice, ...invoices]);

        // Save Invoice to Firestore
        try {
          await db.collection('invoices').add(newInvoice);
          console.log("Invoice saved to cloud!");
        } catch (e) {
          console.error("Cloud invoice save error:", e);
        }

        setCart([]);
        setDiscount(0);
        setActiveInvoice(newInvoice);
        setShowPrintModal(true);
      };

      // Refund Invoice
      const handleRefundInvoice = async (inv) => {
        if (!confirm(`Are you sure you want to refund Invoice ${inv.invoiceNumber}? Stock will be restored.`)) return;

        const updatedProducts = products.map(p => {
          const itemFound = inv.items.find(i => i.id === p.id);
          if (itemFound) {
            return { ...p, stock: p.stock + itemFound.qty };
          }
          return p;
        });

        const updatedInvoices = invoices.map(i => i.invoiceNumber === inv.invoiceNumber ? { ...i, status: 'Returned' } : i);
        setProducts(updatedProducts);
        setInvoices(updatedInvoices);

        if (inv.id) {
          try {
            await db.collection('invoices').doc(inv.id).update({ status: 'Returned' });
          } catch(e) {
            console.error(e);
          }
        }
      };

      // CREATE NEW PRODUCT (SAVED TO FIREBASE CLOUD)
      const handleCreateProduct = async (e) => {
        e.preventDefault();
        if (!newProd.name || !newProd.price) {
          alert('Please fill out Product Name and Price');
          return;
        }

        const createdProduct = {
          name: newProd.name,
          code: newProd.code || 'PRD-' + (products.length + 1),
          price: parseFloat(newProd.price) || 0,
          stock: parseInt(newProd.stock) || 0,
          vatRate: company.vatPercent,
          category: newProd.category || 'General',
          createdAt: new Date().toISOString()
        };

        // Optimistic UI update
        setProducts(prev => [...prev, createdProduct]);
        setNewProd({ name: '', code: '', price: '', stock: '', category: 'General' });
        setShowProdModal(false);

        // SAVE TO FIREBASE CLOUD
        try {
          await db.collection('products').add(createdProduct);
          console.log("Product saved to cloud successfully!");
        } catch(err) {
          console.error("Error saving product to Cloud:", err);
          alert("Saved locally! Cloud error: " + err.message);
        }
      };

      // CREATE NEW CUSTOMER (SAVED TO FIREBASE CLOUD)
      const handleCreateCustomer = async (e) => {
        e.preventDefault();
        if (!newCust.name) {
          alert('Please enter Customer Name');
          return;
        }

        const createdCustomer = {
          name: newCust.name,
          trn: newCust.trn || 'N/A',
          phone: newCust.phone || 'N/A',
          email: newCust.email || 'N/A',
          address: newCust.address || 'UAE',
          createdAt: new Date().toISOString()
        };

        // Optimistic UI update
        setCustomers(prev => [...prev, createdCustomer]);
        setSelectedCustomer(createdCustomer);
        setNewCust({ name: '', trn: '', phone: '', email: '', address: '' });
        setShowCustModal(false);

        // SAVE TO FIREBASE CLOUD
        try {
          await db.collection('customers').add(createdCustomer);
          console.log("Customer saved to cloud successfully!");
        } catch(err) {
          console.error("Error saving customer to Cloud:", err);
          alert("Saved locally! Cloud error: " + err.message);
        }
      };

      // SAVE COMPANY PROFILE TO CLOUD
      const handleSaveCompany = async () => {
        try {
          await db.collection('settings').doc('company').set(company);
          alert("Company settings updated and saved to Cloud!");
        } catch(e) {
          console.error(e);
          alert("Saved locally! Cloud error: " + e.message);
        }
      };

      // Dashboard Calculations
      const stats = useMemo(() => {
        const todayStr = new Date().toISOString().split('T')[0];
        const activeInvoices = invoices.filter(i => i.status !== 'Returned');

        const totalRevenue = activeInvoices.reduce((a, b) => a + (b.grandTotal || 0), 0);
        const totalVat = activeInvoices.reduce((a, b) => a + (b.vatAmount || 0), 0);
        const todaySales = activeInvoices
          .filter(i => i.date && i.date.startsWith(todayStr))
          .reduce((a, b) => a + (b.grandTotal || 0), 0);

        const lowStockCount = products.filter(p => p.stock <= 10).length;

        return { totalRevenue, totalVat, todaySales, count: activeInvoices.length, lowStockCount };
      }, [invoices, products]);

      return (
        <div className="flex flex-col md:flex-row min-h-screen">
          {/* Sidebar Navigation */}
          <aside className="no-print bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 w-full md:w-64 flex-shrink-0 flex flex-col justify-between">
            <div>
              <div className="p-4 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between">
                <div className="flex items-center space-x-3">
                  <div className="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white font-bold text-lg shadow-md">
                    🇦🇪
                  </div>
                  <div>
                    <h1 className="font-bold text-sm leading-tight line-clamp-1">{company.name}</h1>
                    <span className="text-xs text-gray-500">TRN: {company.trn}</span>
                  </div>
                </div>
                <button 
                  onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
                  className="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300">
                  <i data-lucide={theme === 'dark' ? 'sun' : 'moon'} className="w-4 h-4"></i>
                </button>
              </div>

              <nav className="p-3 space-y-1">
                {[
                  { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
                  { id: 'pos', label: 'Create Invoice', icon: 'file-text' },
                  { id: 'invoices', label: 'Invoices & Receipts', icon: 'receipt' },
                  { id: 'products', label: 'Stock & Inventory', icon: 'package' },
                  { id: 'customers', label: 'Customers', icon: 'users' },
                  { id: 'reports', label: 'Settings & Company', icon: 'settings' },
                ].map(nav => (
                  <button
                    key={nav.id}
                    onClick={() => setActiveTab(nav.id)}
                    className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg font-medium text-sm transition-all ${
                      activeTab === nav.id 
                        ? 'bg-brand-600 text-white shadow-md' 
                        : 'text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700/50'
                    }`}>
                    <i data-lucide={nav.icon} className="w-4 h-4"></i>
                    <span>{nav.label}</span>
                  </button>
                ))}
              </nav>
            </div>

            {/* Cloud Sync Status Indicator */}
            <div className="p-3 border-t text-xs">
              <div className="flex items-center space-x-2">
                <span className={`w-2.5 h-2.5 rounded-full ${syncStatus === 'Cloud Connected' ? 'bg-emerald-500 animate-pulse' : 'bg-amber-500'}`}></span>
                <span className="font-semibold">{syncStatus}</span>
              </div>
            </div>
          </aside>

          {/* Main Workspace */}
          <main className="flex-1 overflow-y-auto p-4 md:p-6 mb-16 md:mb-0">
            
            {/* 1. DASHBOARD TAB */}
            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                <div className="flex items-center justify-between">
                  <h2 className="text-2xl font-bold">Sales Overview</h2>
                  <button onClick={() => setActiveTab('pos')} className="bg-brand-600 text-white px-4 py-2 rounded-xl text-sm font-semibold flex items-center space-x-2">
                    <i data-lucide="plus" className="w-4 h-4"></i>
                    <span>New Bill</span>
                  </button>
                </div>

                <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                  <div className="bg-white dark:bg-gray-800 p-4 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm">
                    <span className="text-xs font-semibold text-gray-500 uppercase">Total Revenue</span>
                    <div className="text-xl font-extrabold mt-1">{stats.totalRevenue.toFixed(2)} AED</div>
                  </div>
                  <div className="bg-white dark:bg-gray-800 p-4 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm">
                    <span className="text-xs font-semibold text-gray-500 uppercase">Today's Sales</span>
                    <div className="text-xl font-extrabold mt-1">{stats.todaySales.toFixed(2)} AED</div>
                  </div>
                  <div className="bg-white dark:bg-gray-800 p-4 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm">
                    <span className="text-xs font-semibold text-gray-500 uppercase">UAE VAT (5%)</span>
                    <div className="text-xl font-extrabold mt-1">{stats.totalVat.toFixed(2)} AED</div>
                  </div>
                  <div className="bg-white dark:bg-gray-800 p-4 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm">
                    <span className="text-xs font-semibold text-gray-500 uppercase">Total Bills</span>
                    <div className="text-xl font-extrabold mt-1">{stats.count}</div>
                  </div>
                </div>

                {stats.lowStockCount > 0 && (
                  <div className="bg-amber-50 dark:bg-amber-900/30 border border-amber-200 dark:border-amber-800 rounded-xl p-3 flex items-center justify-between text-xs text-amber-800 dark:text-amber-200">
                    <div className="flex items-center space-x-2">
                      <i data-lucide="alert-triangle" className="w-4 h-4 text-amber-600"></i>
                      <span><strong>{stats.lowStockCount} items</strong> are low on stock (&le; 10 remaining).</span>
                    </div>
                    <button onClick={() => setActiveTab('products')} className="font-bold underline">Manage Stock</button>
                  </div>
                )}

                <div className="bg-white dark:bg-gray-800 rounded-2xl border border-gray-100 dark:border-gray-700 overflow-hidden shadow-sm">
                  <div className="p-4 border-b border-gray-100 dark:border-gray-700 font-bold text-sm">Recent Transactions</div>
                  <table className="w-full text-left text-sm">
                    <thead className="bg-gray-50 dark:bg-gray-700/50 text-xs text-gray-500 uppercase">
                      <tr>
                        <th className="p-3">Invoice #</th>
                        <th className="p-3">Customer</th>
                        <th className="p-3">Amount</th>
                        <th className="p-3">Status</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-gray-100 dark:divide-gray-700">
                      {invoices.slice(0, 5).map((inv, idx) => (
                        <tr key={idx}>
                          <td className="p-3 font-semibold text-brand-600">{inv.invoiceNumber}</td>
                          <td className="p-3">{inv.customer?.name}</td>
                          <td className="p-3 font-bold">{inv.grandTotal?.toFixed(2)} AED</td>
                          <td className="p-3">
                            <span className={`text-xs px-2 py-0.5 rounded-full font-bold ${inv.status === 'Paid' ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'}`}>
                              {inv.status}
                            </span>
                          </td>
                        </tr>
                      ))}
                      {invoices.length === 0 && (
                        <tr><td colSpan="4" className="p-6 text-center text-gray-400">No invoices generated yet.</td></tr>
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* 2. CREATE INVOICE TAB */}
            {activeTab === 'pos' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <div className="lg:col-span-7 space-y-4">
                  <div className="flex items-center justify-between">
                    <h2 className="text-xl font-bold">Select Products</h2>
                    <input
                      type="text"
                      placeholder="Search product..."
                      value={searchProduct}
                      onChange={(e) => setSearchProduct(e.target.value)}
                      className="p-2 text-xs bg-white dark:bg-gray-800 border rounded-xl w-48"
                    />
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 max-h-[calc(100vh-220px)] overflow-y-auto">
                    {products
                      .filter(p => p.name.toLowerCase().includes(searchProduct.toLowerCase()) || p.code?.toLowerCase().includes(searchProduct.toLowerCase()))
                      .map(product => (
                        <div
                          key={product.id || product.code}
                          onClick={() => addToCart(product)}
                          className="bg-white dark:bg-gray-800 p-3 rounded-2xl border border-gray-100 dark:border-gray-700 hover:border-brand-500 cursor-pointer shadow-sm flex flex-col justify-between">
                          <div>
                            <div className="flex justify-between text-[10px] text-gray-400 font-bold mb-1">
                              <span>{product.code || 'PRD'}</span>
                              <span className={product.stock <= 10 ? 'text-amber-600' : ''}>{product.stock} stock</span>
                            </div>
                            <h4 className="font-semibold text-xs line-clamp-2">{product.name}</h4>
                          </div>
                          <div className="mt-2 font-bold text-sm text-brand-600">{product.price.toFixed(2)} AED</div>
                        </div>
                    ))}
                  </div>
                </div>

                <div className="lg:col-span-5 bg-white dark:bg-gray-800 rounded-2xl border border-gray-100 dark:border-gray-700 p-4 shadow-md flex flex-col justify-between">
                  <div>
                    <div className="flex items-center justify-between mb-2">
                      <h3 className="font-bold text-sm">Invoice Summary</h3>
                      <button onClick={() => setShowCustModal(true)} className="text-xs text-brand-600 font-bold hover:underline">+ Add Customer</button>
                    </div>

                    <select
                      value={selectedCustomer?.id || ''}
                      onChange={(e) => setSelectedCustomer(customers.find(c => c.id === e.target.value) || customers[0])}
                      className="w-full p-2 text-xs bg-gray-50 dark:bg-gray-700 border rounded-xl mb-3">
                      {customers.map((c, idx) => (
                        <option key={c.id || idx} value={c.id}>{c.name} {c.trn && c.trn !== 'N/A' ? `(TRN: ${c.trn})` : ''}</option>
                      ))}
                    </select>

                    <div className="space-y-2 max-h-48 overflow-y-auto border-t border-b border-gray-100 dark:border-gray-700 py-2">
                      {cart.map(item => (
                        <div key={item.id || item.name} className="flex items-center justify-between text-xs">
                          <div className="flex-1 pr-2">
                            <span className="font-bold">{item.name}</span>
                            <div className="text-[10px] text-gray-400">{item.price.toFixed(2)} AED</div>
                          </div>
                          <div className="flex items-center space-x-2">
                            <button onClick={() => updateCartQty(item.id, item.qty - 1)} className="w-5 h-5 bg-gray-100 dark:bg-gray-700 rounded font-bold">-</button>
                            <span>{item.qty}</span>
                            <button onClick={() => updateCartQty(item.id, item.qty + 1)} className="w-5 h-5 bg-gray-100 dark:bg-gray-700 rounded font-bold">+</button>
                            <span className="font-bold w-12 text-right">{(item.price * item.qty).toFixed(2)}</span>
                          </div>
                        </div>
                      ))}
                      {cart.length === 0 && <div className="text-xs text-gray-400 text-center py-6">Cart is empty. Tap products to add.</div>}
                    </div>

                    <div className="space-y-2 pt-3 text-xs">
                      <div className="flex items-center justify-between">
                        <span className="text-gray-500">Discount:</span>
                        <div className="flex items-center space-x-1">
                          <input type="number" min="0" value={discount} onChange={(e) => setDiscount(parseFloat(e.target.value) || 0)} className="w-16 p-1 border rounded text-xs text-right" />
                          <select value={discountType} onChange={(e) => setDiscountType(e.target.value)} className="p-1 border rounded text-xs">
                            <option value="amount">AED</option>
                            <option value="percent">%</option>
                          </select>
                        </div>
                      </div>

                      <div className="flex items-center justify-between">
                        <span className="text-gray-500">Payment Method:</span>
                        <select value={paymentMethod} onChange={(e) => setPaymentMethod(e.target.value)} className="p-1 border rounded text-xs capitalize">
                          <option value="cash">Cash</option>
                          <option value="card">Card</option>
                          <option value="bank">Bank Transfer</option>
                        </select>
                      </div>
                    </div>
                  </div>

                  <div className="pt-3 border-t border-gray-100 dark:border-gray-700 space-y-1 text-xs mt-3">
                    <div className="flex justify-between"><span>Subtotal:</span><span>{cartCalculations.subtotal.toFixed(2)} AED</span></div>
                    {cartCalculations.discAmount > 0 && <div className="flex justify-between text-red-500"><span>Discount:</span><span>-{cartCalculations.discAmount.toFixed(2)} AED</span></div>}
                    <div className="flex justify-between"><span>VAT ({company.vatPercent}%):</span><span>{cartCalculations.vatTotal.toFixed(2)} AED</span></div>
                    <div className="flex justify-between font-extrabold text-base text-brand-600 pt-1 border-t"><span>Grand Total:</span><span>{cartCalculations.grandTotal.toFixed(2)} AED</span></div>
                    
                    <button onClick={handleCheckout} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-md mt-2 flex items-center justify-center space-x-2">
                      <i data-lucide="check-circle" className="w-4 h-4"></i>
                      <span>Generate Tax Invoice</span>
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* 3. INVOICES HISTORY */}
            {activeTab === 'invoices' && (
              <div className="space-y-4">
                <div className="flex items-center justify-between">
                  <h2 className="text-xl font-bold">Invoices & Receipts</h2>
                  <input
                    type="text"
                    placeholder="Search bill # or customer..."
                    value={searchInvoice}
                    onChange={(e) => setSearchInvoice(e.target.value)}
                    className="p-2 text-xs bg-white dark:bg-gray-800 border rounded-xl w-64"
                  />
                </div>

                <div className="bg-white dark:bg-gray-800 rounded-2xl border border-gray-100 dark:border-gray-700 overflow-hidden shadow-sm">
                  <table className="w-full text-left text-sm">
                    <thead className="bg-gray-50 dark:bg-gray-700/50 text-xs text-gray-500 uppercase">
                      <tr>
                        <th className="p-3">Invoice #</th>
                        <th className="p-3">Date</th>
                        <th className="p-3">Customer</th>
                        <th className="p-3">VAT (5%)</th>
                        <th className="p-3">Total</th>
                        <th className="p-3">Status</th>
                        <th className="p-3 text-right">Action</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-gray-100 dark:divide-gray-700">
                      {invoices
                        .filter(i => i.invoiceNumber?.toLowerCase().includes(searchInvoice.toLowerCase()) || i.customer?.name?.toLowerCase().includes(searchInvoice.toLowerCase()))
                        .map((inv, idx) => (
                          <tr key={idx}>
                            <td className="p-3 font-bold text-brand-600">{inv.invoiceNumber}</td>
                            <td className="p-3 text-xs">{new Date(inv.date).toLocaleDateString()}</td>
                            <td className="p-3">{inv.customer?.name}</td>
                            <td className="p-3">{inv.vatAmount?.toFixed(2)} AED</td>
                            <td className="p-3 font-bold">{inv.grandTotal?.toFixed(2)} AED</td>
                            <td className="p-3">
                              <span className={`text-xs px-2 py-0.5 rounded-full font-bold ${inv.status === 'Paid' ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'}`}>
                                {inv.status}
                              </span>
                            </td>
                            <td className="p-3 text-right space-x-2">
                              <button onClick={() => { setActiveInvoice(inv); setShowPrintModal(true); }} className="p-1.5 bg-gray-100 dark:bg-gray-700 rounded-lg">
                                <i data-lucide="printer" className="w-4 h-4"></i>
                              </button>
                              {inv.status !== 'Returned' && (
                                <button onClick={() => handleRefundInvoice(inv)} className="p-1.5 bg-red-50 text-red-600 rounded-lg" title="Refund Invoice">
                                  <i data-lucide="rotate-ccw" className="w-4 h-4"></i>
                                </button>
                              )}
                            </td>
                          </tr>
                        ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* 4. STOCK & INVENTORY MANAGEMENT */}
            {activeTab === 'products' && (
              <div className="space-y-4">
                <div className="flex items-center justify-between">
                  <h2 className="text-xl font-bold">Products & Stock Inventory</h2>
                  <button onClick={() => setShowProdModal(true)} className="bg-brand-600 text-white px-3 py-2 rounded-xl text-xs font-bold flex items-center space-x-1">
                    <i data-lucide="plus" className="w-4 h-4"></i>
                    <span>Add Product</span>
                  </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {products.map((p, idx) => (
                    <div key={p.id || idx} className="bg-white dark:bg-gray-800 p-4 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm flex justify-between items-center">
                      <div>
                        <span className="text-[10px] text-gray-400 font-bold">{p.code || 'PRD'}</span>
                        <h4 className="font-bold text-sm">{p.name}</h4>
                        <div className="text-xs text-gray-500 font-semibold">{p.price.toFixed(2)} AED</div>
                      </div>
                      <div className="text-right">
                        <span className={`text-xs font-bold px-2 py-1 rounded-lg ${p.stock <= 10 ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}`}>
                          {p.stock} Stock
                        </span>
                        <button
                          onClick={() => {
                            const newQty = parseInt(prompt("Enter updated stock count:", p.stock));
                            if (!isNaN(newQty)) {
                              setProducts(products.map(item => item === p ? { ...item, stock: newQty } : item));
                              if (p.id) db.collection('products').doc(p.id).update({ stock: newQty }).catch(e => console.error(e));
                            }
                          }}
                          className="block text-[10px] font-bold text-brand-600 mt-2 hover:underline">
                          Adjust Stock
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 5. CUSTOMERS DIRECTORY */}
            {activeTab === 'customers' && (
              <div className="space-y-4">
                <div className="flex items-center justify-between">
                  <h2 className="text-xl font-bold">Customer Directory</h2>
                  <button onClick={() => setShowCustModal(true)} className="bg-brand-600 text-white px-3 py-2 rounded-xl text-xs font-bold flex items-center space-x-1">
                    <i data-lucide="user-plus" className="w-4 h-4"></i>
                    <span>Add Customer</span>
                  </button>
                </div>

                <div className="bg-white dark:bg-gray-800 rounded-2xl border border-gray-100 dark:border-gray-700 overflow-hidden shadow-sm">
                  <table className="w-full text-left text-sm">
                    <thead className="bg-gray-50 dark:bg-gray-700/50 text-xs text-gray-500 uppercase">
                      <tr>
                        <th className="p-3">Customer Name</th>
                        <th className="p-3">TRN (Tax #)</th>
                        <th className="p-3">Phone</th>
                        <th className="p-3">Address</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-gray-100 dark:divide-gray-700">
                      {customers.map((c, idx) => (
                        <tr key={c.id || idx}>
                          <td className="p-3 font-bold">{c.name}</td>
                          <td className="p-3 font-mono text-xs">{c.trn}</td>
                          <td className="p-3 text-xs">{c.phone}</td>
                          <td className="p-3 text-xs text-gray-500">{c.address}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* 6. SETTINGS & COMPANY PROFILE */}
            {activeTab === 'reports' && (
              <div className="space-y-4">
                <div className="flex items-center justify-between">
                  <h2 className="text-xl font-bold">Company & Tax Settings</h2>
                  <button onClick={handleSaveCompany} className="bg-brand-600 text-white px-4 py-2 rounded-xl text-xs font-bold shadow">Save Settings</button>
                </div>
                <div className="bg-white dark:bg-gray-800 p-6 rounded-2xl border border-gray-100 dark:border-gray-700 max-w-lg space-y-3 text-xs">
                  <div>
                    <label className="font-semibold text-gray-500">Business Name</label>
                    <input type="text" value={company.name} onChange={(e) => setCompany({ ...company, name: e.target.value })} className="w-full p-2 bg-gray-50 dark:bg-gray-700 border rounded-lg mt-1 font-bold" />
                  </div>
                  <div>
                    <label className="font-semibold text-gray-500">UAE TRN (Tax Registration Number)</label>
                    <input type="text" value={company.trn} onChange={(e) => setCompany({ ...company, trn: e.target.value })} className="w-full p-2 bg-gray-50 dark:bg-gray-700 border rounded-lg mt-1 font-mono" />
                  </div>
                  <div>
                    <label className="font-semibold text-gray-500">Phone Number</label>
                    <input type="text" value={company.phone} onChange={(e) => setCompany({ ...company, phone: e.target.value })} className="w-full p-2 bg-gray-50 dark:bg-gray-700 border rounded-lg mt-1" />
                  </div>
                  <div>
                    <label className="font-semibold text-gray-500">Address</label>
                    <input type="text" value={company.address} onChange={(e) => setCompany({ ...company, address: e.target.value })} className="w-full p-2 bg-gray-50 dark:bg-gray-700 border rounded-lg mt-1" />
                  </div>
                  <div>
                    <label className="font-semibold text-gray-500">Standard VAT Rate (%)</label>
                    <input type="number" value={company.vatPercent} onChange={(e) => setCompany({ ...company, vatPercent: parseFloat(e.target.value) || 0 })} className="w-full p-2 bg-gray-50 dark:bg-gray-700 border rounded-lg mt-1" />
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* ADD PRODUCT MODAL */}
          {showProdModal && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
              <div className="bg-white dark:bg-gray-800 p-6 rounded-2xl max-w-md w-full shadow-2xl">
                <h3 className="font-bold text-base mb-4">Add New Product</h3>
                <form onSubmit={handleCreateProduct} className="space-y-3 text-xs">
                  <div>
                    <label className="font-semibold text-gray-500">Product Name *</label>
                    <input type="text" required value={newProd.name} onChange={e => setNewProd({ ...newProd, name: e.target.value })} className="w-full p-2 bg-gray-50 dark:bg-gray-700 border rounded-lg mt-1" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-semibold text-gray-500">Code/SKU</label>
                      <input type="text" value={newProd.code} onChange={e => setNewProd({ ...newProd, code: e.target.value })} placeholder="Auto" className="w-full p-2 bg-gray-50 dark:bg-gray-700 border rounded-lg mt-1" />
                    </div>
                    <div>
                      <label className="font-semibold text-gray-500">Price (AED) *</label>
                      <input type="number" step="0.01" required value={newProd.price} onChange={e => setNewProd({ ...newProd, price: e.target.value })} className="w-full p-2 bg-gray-50 dark:bg-gray-700 border rounded-lg mt-1" />
                    </div>
                  </div>
                  <div>
                    <label className="font-semibold text-gray-500">Initial Stock Quantity</label>
                    <input type="number" value={newProd.stock} onChange={e => setNewProd({ ...newProd, stock: e.target.value })} className="w-full p-2 bg-gray-50 dark:bg-gray-700 border rounded-lg mt-1" />
                  </div>
                  <div className="flex justify-end space-x-2 pt-3">
                    <button type="button" onClick={() => setShowProdModal(false)} className="px-4 py-2 bg-gray-200 dark:bg-gray-700 rounded-lg font-bold">Cancel</button>
                    <button type="submit" className="px-4 py-2 bg-brand-600 text-white rounded-lg font-bold">Save Product</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ADD CUSTOMER MODAL */}
          {showCustModal && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
              <div className="bg-white dark:bg-gray-800 p-6 rounded-2xl max-w-md w-full shadow-2xl">
                <h3 className="font-bold text-base mb-4">Add Customer Profile</h3>
                <form onSubmit={handleCreateCustomer} className="space-y-3 text-xs">
                  <div>
                    <label className="font-semibold text-gray-500">Customer / Business Name *</label>
                    <input type="text" required value={newCust.name} onChange={e => setNewCust({ ...newCust, name: e.target.value })} className="w-full p-2 bg-gray-50 dark:bg-gray-700 border rounded-lg mt-1" />
                  </div>
                  <div>
                    <label className="font-semibold text-gray-500">UAE TRN Number (Optional)</label>
                    <input type="text" value={newCust.trn} onChange={e => setNewCust({ ...newCust, trn: e.target.value })} className="w-full p-2 bg-gray-50 dark:bg-gray-700 border rounded-lg mt-1 font-mono" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-semibold text-gray-500">Phone</label>
                      <input type="text" value={newCust.phone} onChange={e => setNewCust({ ...newCust, phone: e.target.value })} className="w-full p-2 bg-gray-50 dark:bg-gray-700 border rounded-lg mt-1" />
                    </div>
                    <div>
                      <label className="font-semibold text-gray-500">Address</label>
                      <input type="text" value={newCust.address} onChange={e => setNewCust({ ...newCust, address: e.target.value })} className="w-full p-2 bg-gray-50 dark:bg-gray-700 border rounded-lg mt-1" />
                    </div>
                  </div>
                  <div className="flex justify-end space-x-2 pt-3">
                    <button type="button" onClick={() => setShowCustModal(false)} className="px-4 py-2 bg-gray-200 dark:bg-gray-700 rounded-lg font-bold">Cancel</button>
                    <button type="submit" className="px-4 py-2 bg-brand-600 text-white rounded-lg font-bold">Save Customer</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* PRINT TAX RECEIPT MODAL */}
          {showPrintModal && activeInvoice && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
              <div className="bg-white p-6 rounded-2xl max-w-sm w-full text-black shadow-2xl">
                <div id="printable-area" className="text-xs space-y-3 font-mono">
                  <div className="text-center border-b pb-2">
                    <h3 className="font-extrabold text-base tracking-wider">TAX INVOICE / فاتورة ضريبية</h3>
                    <p className="font-bold text-sm mt-1">{activeInvoice.company?.name}</p>
                    <p className="text-[10px]">{activeInvoice.company?.address}</p>
                    <p className="font-bold text-[11px]">TRN: {activeInvoice.company?.trn}</p>
                  </div>
                  <div className="text-[11px] border-b pb-2 space-y-0.5">
                    <div><strong>Invoice #:</strong> {activeInvoice.invoiceNumber}</div>
                    <div><strong>Date:</strong> {new Date(activeInvoice.date).toLocaleString()}</div>
                    <div><strong>Customer:</strong> {activeInvoice.customer?.name}</div>
                    <div><strong>Customer TRN:</strong> {activeInvoice.customer?.trn}</div>
                  </div>
                  <table className="w-full text-left border-t border-b py-1">
                    <thead>
                      <tr className="border-b text-[10px] uppercase">
                        <th className="py-1">Item</th>
                        <th className="py-1 text-center">Qty</th>
                        <th className="py-1 text-right">Price</th>
                        <th className="py-1 text-right">Total</th>
                      </tr>
                    </thead>
                    <tbody>
                      {activeInvoice.items?.map((item, idx) => (
                        <tr key={idx}>
                          <td className="py-1 pr-1">{item.name}</td>
                          <td className="py-1 text-center">{item.qty}</td>
                          <td className="py-1 text-right">{item.price.toFixed(2)}</td>
                          <td className="py-1 text-right font-bold">{(item.price * item.qty).toFixed(2)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                  <div className="text-right space-y-1 text-[11px] pt-1">
                    <div className="flex justify-between"><span>Subtotal:</span><span>{activeInvoice.subtotal?.toFixed(2)} AED</span></div>
                    {activeInvoice.discount > 0 && <div className="flex justify-between text-red-600"><span>Discount:</span><span>-{activeInvoice.discount?.toFixed(2)} AED</span></div>}
                    <div className="flex justify-between"><span>VAT (5%):</span><span>{activeInvoice.vatAmount?.toFixed(2)} AED</span></div>
                    <div className="flex justify-between font-extrabold text-sm border-t pt-1"><span>Grand Total:</span><span>{activeInvoice.grandTotal?.toFixed(2)} AED</span></div>
                  </div>
                  <div className="text-center text-[10px] text-gray-500 pt-3 border-t">
                    Thank you for your business! / شكراً لزيارتكم
                  </div>
                </div>
                <div className="no-print flex justify-end space-x-2 mt-4">
                  <button onClick={() => setShowPrintModal(false)} className="px-3 py-1.5 bg-gray-200 rounded-lg text-xs font-bold">Close</button>
                  <button onClick={() => window.print()} className="px-4 py-1.5 bg-brand-600 text-white rounded-lg text-xs font-bold flex items-center space-x-1">
                    <i data-lucide="printer" className="w-4 h-4"></i>
                    <span>Print Receipt</span>
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
