<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Invoicify - UAE Billing & Inventory System</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0284c7',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase Compatibility Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    @media print {
      body * { visibility: hidden; }
      #printable-area, #printable-area * { visibility: visible; }
      #printable-area {
        position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 24px;
        color: #000 !important; background: #fff !important; font-size: 13px !important;
      }
      .no-print { display: none !important; }
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    input, select, textarea {
      font-size: 16px !important;
      touch-action: manipulation;
    }
    button {
      touch-action: manipulation;
      cursor: pointer;
    }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 1rem); }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-200 antialiased selection:bg-brand-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyDc113ArrZa-bBCvKl-3UEwi4pIAdtwmIA",
      authDomain: "tharavad336.firebaseapp.com",
      projectId: "tharavad336",
      storageBucket: "tharavad336.firebasestorage.app",
      messagingSenderId: "124534840254",
      appId: "1:124534840254:web:825d9c694eea1934d977ef",
      measurementId: "G-XZ92F73DVT"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    const getCol = (colName) => db.collection('artifacts').doc('invoicify_app').collection('public').doc('data').collection(colName);

    function App() {
      // Authentication State
      const [currentUser, setCurrentUser] = useState(() => {
        const local = sessionStorage.getItem('inv_current_user');
        return local ? JSON.parse(local) : null;
      });
      const [loginUsername, setLoginUsername] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [usersList, setUsersList] = useState([]);

      const [theme, setTheme] = useState(localStorage.getItem('theme') || 'light');
      const [activeTab, setActiveTab] = useState('dashboard');
      const [billsSubTab, setBillsSubTab] = useState('sales'); 
      const [reportsSubTab, setReportsSubTab] = useState('advanced_overview'); 
      const [reportsDateFilter, setReportsDateFilter] = useState('all'); 
      const [reportsSalesmanFilter, setReportsSalesmanFilter] = useState('all');
      const [reportsPaymentFilter, setReportsPaymentFilter] = useState('all');
      const [reportsCustomerFilter, setReportsCustomerFilter] = useState('all');
      const [syncStatus, setSyncStatus] = useState('Connecting...');

      const [company, setCompany] = useState(() => {
        const local = localStorage.getItem('inv_company');
        return local ? JSON.parse(local) : {
          name: 'YOUR BUSINESS NAME LLC',
          trn: '',
          phone: '',
          email: '',
          address: 'UAE',
          currency: 'AED',
          vatPercent: 5
        };
      });

      const [products, setProducts] = useState(() => {
        const local = localStorage.getItem('inv_products');
        return local ? JSON.parse(local) : [];
      });
      const [customers, setCustomers] = useState(() => {
        const local = localStorage.getItem('inv_customers');
        return local ? JSON.parse(local) : [];
      });
      const [invoices, setInvoices] = useState(() => {
        const local = localStorage.getItem('inv_invoices');
        return local ? JSON.parse(local) : [];
      });
      const [settlements, setSettlements] = useState(() => {
        const local = localStorage.getItem('inv_settlements');
        return local ? JSON.parse(local) : [];
      });

      // Cart & Billing State
      const [cart, setCart] = useState([]);
      const [selectedCustomer, setSelectedCustomer] = useState(null);
      
      const [customerSearchQuery, setCustomerSearchQuery] = useState('');
      const [showCustDropdown, setShowCustDropdown] = useState(false);
      const custDropdownRef = useRef(null);

      const [customerDirectorySearch, setCustomerDirectorySearch] = useState('');
      const [stockDirectorySearch, setStockDirectorySearch] = useState('');

      const [discount, setDiscount] = useState(0);
      const [discountType, setDiscountType] = useState('amount');
      const [paymentMethod, setPaymentMethod] = useState('cash');
      const [searchProduct, setSearchProduct] = useState('');
      const [convertingOrderNo, setConvertingOrderNo] = useState(null);

      const [activeInvoice, setActiveInvoice] = useState(null);
      const [showPrintModal, setShowPrintModal] = useState(false);
      const [searchInvoice, setSearchInvoice] = useState('');
      const [showCheckoutConfirm, setShowCheckoutConfirm] = useState(false);

      const [showProdModal, setShowProdModal] = useState(false);
      const [editingProd, setEditingProd] = useState(null);
      const [prodForm, setProdForm] = useState({ name: '', code: '', price: '', stock: '', category: 'General' });

      const [showCustModal, setShowCustModal] = useState(false);
      const [editingCust, setEditingCust] = useState(null);
      const [custForm, setCustForm] = useState({ name: '', phone: '', email: '', trn: '', address: '' });

      const [showEditBillModal, setShowEditBillModal] = useState(false);
      const [editingBill, setEditingBill] = useState(null);

      // Settlements modal state
      const [showSettleModal, setShowSettleModal] = useState(false);
      const [settleCustomer, setSettleCustomer] = useState(null);
      const [settleAmount, setSettleAmount] = useState('');
      const [settleMethod, setSettleMethod] = useState('cash');
      const [settleNotes, setSettleNotes] = useState('');

      // User Management Modals
      const [showUserModal, setShowUserModal] = useState(false);
      const [newUserForm, setNewUserForm] = useState({ username: '', password: '', role: 'salesman', canEditStock: false, canDeleteBills: false, canViewReports: true });
      
      const [showEditUserModal, setShowEditUserModal] = useState(false);
      const [editingUser, setEditingUser] = useState(null);

      const [showChangePassModal, setShowChangePassModal] = useState(false);
      const [adminNewPass, setAdminNewPass] = useState('');

      useEffect(() => {
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        localStorage.setItem('theme', theme);
      }, [theme]);

      useEffect(() => {
        const handleClickOutside = (e) => {
          if (custDropdownRef.current && !custDropdownRef.current.contains(e.target)) {
            setShowCustDropdown(false);
          }
        };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      // --- FIRESTORE REALTIME SYNC LISTENERS ---
      useEffect(() => {
        const unsubInvoices = getCol('invoices').onSnapshot(
          (snapshot) => {
            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            if (data.length >= 0) {
              setInvoices(data);
              localStorage.setItem('inv_invoices', JSON.stringify(data));
            }
            setSyncStatus('Cloud Connected');
          },
          (err) => { console.error("Invoices sync error:", err); setSyncStatus('Offline Mode'); }
        );

        const unsubSettlements = getCol('settlements').onSnapshot(
          (snapshot) => {
            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            if (data.length >= 0) {
              setSettlements(data);
              localStorage.setItem('inv_settlements', JSON.stringify(data));
            }
          },
          (err) => console.error("Settlements sync error:", err)
        );

        const unsubCustomers = getCol('customers').onSnapshot(
          (snapshot) => {
            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            if (data.length > 0) {
              setCustomers(data);
              localStorage.setItem('inv_customers', JSON.stringify(data));
            }
          },
          (err) => console.error("Customers sync error:", err)
        );

        const unsubProducts = getCol('products').onSnapshot(
          (snapshot) => {
            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            if (data.length >= 0) {
              setProducts(data);
              localStorage.setItem('inv_products', JSON.stringify(data));
            }
          },
          (err) => console.error("Products sync error:", err)
        );

        const unsubUsers = getCol('users').onSnapshot(
          (snapshot) => {
            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            if (data.length === 0) {
              const defaultAdmin = { username: 'admin', password: 'admin', role: 'admin', canEditStock: true, canDeleteBills: true, canViewReports: true };
              getCol('users').add(defaultAdmin);
            } else {
              setUsersList(data);
            }
          },
          (err) => console.error("Users sync error:", err)
        );

        const unsubCompany = getCol('settings').doc('company').onSnapshot(
          (doc) => {
            if (doc.exists) {
              setCompany(doc.data());
              localStorage.setItem('inv_company', JSON.stringify(doc.data()));
            }
          },
          (err) => console.error("Company sync error:", err)
        );

        return () => {
          unsubInvoices();
          unsubSettlements();
          unsubCustomers();
          unsubProducts();
          unsubUsers();
          unsubCompany();
        };
      }, []);

      useEffect(() => { localStorage.setItem('inv_company', JSON.stringify(company)); }, [company]);
      useEffect(() => { localStorage.setItem('inv_products', JSON.stringify(products)); }, [products]);
      useEffect(() => { localStorage.setItem('inv_customers', JSON.stringify(customers)); }, [customers]);
      useEffect(() => { localStorage.setItem('inv_invoices', JSON.stringify(invoices)); }, [invoices]);
      useEffect(() => { localStorage.setItem('inv_settlements', JSON.stringify(settlements)); }, [settlements]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      const handleLogin = (e) => {
        e.preventDefault();
        const found = usersList.find(u => u.username.toLowerCase() === loginUsername.trim().toLowerCase() && u.password === loginPassword);
        if (found) {
          const userObj = { id: found.id, username: found.username, role: found.role, canEditStock: found.canEditStock, canDeleteBills: found.canDeleteBills, canViewReports: found.canViewReports };
          setCurrentUser(userObj);
          sessionStorage.setItem('inv_current_user', JSON.stringify(userObj));
          setActiveTab('dashboard');
        } else {
          alert('Invalid username or password. Default is admin / admin.');
        }
      };

      const handleLogout = () => {
        setCurrentUser(null);
        sessionStorage.removeItem('inv_current_user');
      };

      const handleCreateUser = async (e) => {
        e.preventDefault();
        if (!newUserForm.username || !newUserForm.password) return;
        try {
          await getCol('users').add({
            username: newUserForm.username.trim(),
            password: newUserForm.password,
            role: newUserForm.role,
            canEditStock: newUserForm.canEditStock,
            canDeleteBills: newUserForm.canDeleteBills,
            canViewReports: newUserForm.canViewReports,
            createdAt: new Date().toISOString()
          });
          alert(`User "${newUserForm.username}" created successfully!`);
          setNewUserForm({ username: '', password: '', role: 'salesman', canEditStock: false, canDeleteBills: false, canViewReports: true });
          setShowUserModal(false);
        } catch(e) {
          alert("Error creating user: " + e.message);
        }
      };

      const openEditUser = (u) => {
        setEditingUser({
          id: u.id,
          username: u.username,
          password: u.password,
          role: u.role || 'salesman',
          canEditStock: !!u.canEditStock,
          canDeleteBills: !!u.canDeleteBills,
          canViewReports: u.canViewReports !== false
        });
        setShowEditUserModal(true);
      };

      const handleSaveEditedUser = async (e) => {
        e.preventDefault();
        if (!editingUser || !editingUser.id) return;
        try {
          await getCol('users').doc(editingUser.id).update({
            password: editingUser.password,
            role: editingUser.role,
            canEditStock: editingUser.canEditStock,
            canDeleteBills: editingUser.canDeleteBills,
            canViewReports: editingUser.canViewReports,
            updatedAt: new Date().toISOString()
          });
          alert(`Privileges updated for "${editingUser.username}"!`);
          setShowEditUserModal(false);
        } catch(e) {
          alert("Error updating user: " + e.message);
        }
      };

      const handleDeleteUser = async (u) => {
        if (u.username === 'admin') {
          alert("Cannot delete master admin account.");
          return;
        }
        if (!confirm(`Delete user "${u.username}"?`)) return;
        if (u.id) {
          try { await getCol('users').doc(u.id).delete(); } catch(e) { console.error(e); }
        }
      };

      const handleUpdateAdminPassword = async (e) => {
        e.preventDefault();
        if (!adminNewPass) return;
        const adminDoc = usersList.find(u => u.username === 'admin');
        if (adminDoc && adminDoc.id) {
          try {
            await getCol('users').doc(adminDoc.id).update({ password: adminNewPass });
            alert("Admin password updated successfully!");
            setShowChangePassModal(false);
            setAdminNewPass('');
          } catch(e) {
            alert("Error updating password: " + e.message);
          }
        }
      };

      // Customer Outstanding Calculations
      const customerLedgerSummary = useMemo(() => {
        const map = {};
        customers.forEach(c => {
          map[c.name] = { customer: c, totalCredit: 0, totalPaid: 0, balance: 0, invoicesCount: 0 };
        });

        invoices.filter(i => i.status === 'Paid').forEach(inv => {
          const cName = inv.customer?.name;
          if (cName) {
            if (!map[cName]) {
              map[cName] = { customer: inv.customer, totalCredit: 0, totalPaid: 0, balance: 0, invoicesCount: 0 };
            }
            map[cName].invoicesCount += 1;
            if (inv.paymentMethod === 'credit') {
              map[cName].totalCredit += (inv.grandTotal || 0);
            } else {
              map[cName].totalPaid += (inv.grandTotal || 0);
            }
          }
        });

        settlements.forEach(s => {
          const cName = s.customerName;
          if (cName && map[cName]) {
            map[cName].totalPaid += (s.amount || 0);
          }
        });

        Object.keys(map).forEach(key => {
          const item = map[key];
          let creditSales = 0;
          invoices.filter(i => i.status === 'Paid' && i.customer?.name === key && i.paymentMethod === 'credit').forEach(i => creditSales += (i.grandTotal || 0));
          
          let paidSettlements = 0;
          settlements.filter(s => s.customerName === key).forEach(s => paidSettlements += (s.amount || 0));

          item.balance = Math.max(0, creditSales - paidSettlements);
        });

        return Object.values(map);
      }, [customers, invoices, settlements]);

      const handleSaveSettlement = async (e) => {
        e.preventDefault();
        const amt = parseFloat(settleAmount);
        if (!settleCustomer || isNaN(amt) || amt <= 0) {
          alert('Please select a customer and enter a valid settlement amount.');
          return;
        }

        const settlementDoc = {
          receiptNo: `SET-${new Date().getFullYear()}-${Math.floor(1000 + Math.random() * 9000)}`,
          date: new Date().toISOString(),
          customerName: settleCustomer.name,
          customerPhone: settleCustomer.phone,
          amount: amt,
          paymentMethod: settleMethod,
          notes: settleNotes || 'Credit settlement',
          salesman: currentUser ? currentUser.username : 'admin'
        };

        try {
          await getCol('settlements').add(settlementDoc);
          alert(`Settlement of ${amt.toFixed(2)} AED recorded successfully for ${settleCustomer.name}!`);
          setShowSettleModal(false);
          setSettleAmount('');
          setSettleNotes('');
        } catch(e) {
          alert("Error saving settlement: " + e.message);
        }
      };

      const filteredCustomersForBilling = useMemo(() => {
        if (!customerSearchQuery.trim()) return customers;
        const q = customerSearchQuery.toLowerCase();
        return customers.filter(c => 
          (c.name && c.name.toLowerCase().includes(q)) ||
          (c.phone && c.phone.toLowerCase().includes(q)) ||
          (c.email && c.email.toLowerCase().includes(q)) ||
          (c.trn && c.trn.toLowerCase().includes(q))
        );
      }, [customers, customerSearchQuery]);

      const filteredCustomersDirectory = useMemo(() => {
        if (!customerDirectorySearch.trim()) return customers;
        const q = customerDirectorySearch.toLowerCase();
        return customers.filter(c => 
          (c.name && c.name.toLowerCase().includes(q)) ||
          (c.phone && c.phone.toLowerCase().includes(q)) ||
          (c.email && c.email.toLowerCase().includes(q)) ||
          (c.trn && c.trn.toLowerCase().includes(q))
        );
      }, [customers, customerDirectorySearch]);

      const filteredStockDirectory = useMemo(() => {
        if (!stockDirectorySearch.trim()) return products;
        const q = stockDirectorySearch.toLowerCase();
        return products.filter(p => 
          (p.name && p.name.toLowerCase().includes(q)) ||
          (p.code && p.code.toLowerCase().includes(q)) ||
          (p.category && p.category.toLowerCase().includes(q))
        );
      }, [products, stockDirectorySearch]);

      const cartCalculations = useMemo(() => {
        const subtotal = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
        let discAmount = 0;
        if (discountType === 'amount') {
          discAmount = Math.min(discount, subtotal);
        } else {
          discAmount = (subtotal * Math.min(discount, 100)) / 100;
        }
        const netTaxable = Math.max(0, subtotal - discAmount);
        const vatTotal = netTaxable * (company.vatPercent / 100);
        const grandTotal = netTaxable + vatTotal;

        return { subtotal, discAmount, netTaxable, vatTotal, grandTotal };
      }, [cart, discount, discountType, company.vatPercent]);

      const addToCart = (product) => {
        if (product.stock <= 0) {
          alert('Warning: Product is out of stock!');
          return;
        }
        const existing = cart.find(i => i.id === product.id);
        if (existing) {
          if (existing.qty >= product.stock) {
            alert(`Stock limit (${product.stock}) reached.`);
            return;
          }
          setCart(cart.map(i => i.id === product.id ? { ...i, qty: i.qty + 1 } : i));
        } else {
          setCart([...cart, { ...product, qty: 1 }]);
        }
      };

      const updateCartQty = (id, newQty) => {
        const prod = products.find(p => p.id === id);
        if (newQty > prod.stock) {
          alert(`Stock limit reached! Max available: ${prod.stock}`);
          return;
        }
        if (newQty <= 0) {
          setCart(cart.filter(i => i.id !== id));
        } else {
          setCart(cart.map(i => i.id === id ? { ...i, qty: newQty } : i));
        }
      };

      const startCheckout = () => {
        if (cart.length === 0) {
          alert("Please add items to invoice before proceeding.");
          return;
        }
        if (!selectedCustomer) {
          alert("Please select or search for a customer.");
          return;
        }
        setShowCheckoutConfirm(true);
      };

      const confirmAndSaveOrder = async (orderType) => {
        const isTaxInvoice = orderType === 'TAX_INVOICE';
        const prefix = isTaxInvoice ? 'INV' : 'SO';
        // Bugfix 1: Use timestamp and secure random values to prevent invoice ID collisions/duplicates across users & deletions
        const docNumber = `${prefix}-${new Date().getFullYear()}-${Math.floor(1000 + Math.random() * 9000)}`;
        
        const newDoc = {
          invoiceNumber: docNumber,
          type: isTaxInvoice ? 'Tax Invoice' : 'Sales Order',
          date: new Date().toISOString(),
          customer: selectedCustomer,
          salesman: currentUser ? currentUser.username : 'admin',
          items: cart,
          company: company,
          subtotal: cartCalculations.subtotal,
          discount: cartCalculations.discAmount,
          taxableAmount: cartCalculations.netTaxable,
          vatAmount: cartCalculations.vatTotal,
          vatRate: company.vatPercent,
          grandTotal: cartCalculations.grandTotal,
          paymentMethod: paymentMethod, 
          status: isTaxInvoice ? 'Paid' : 'Sales Order',
          preOrderReference: convertingOrderNo || null
        };

        try {
          if (isTaxInvoice) {
            // Bugfix 2: Atomic-like inventory deduction checks & error handling feedback instead of silent console logs
            for (let item of cart) {
              const currentProd = products.find(p => p.id === item.id);
              if (!currentProd || currentProd.stock < item.qty) {
                throw new Error(`Insufficient stock for "${item.name}". Available: ${currentProd ? currentProd.stock : 0}`);
              }
            }

            const updatedProducts = products.map(p => {
              const cartItem = cart.find(c => c.id === p.id);
              if (cartItem) {
                const newStock = Math.max(0, p.stock - cartItem.qty);
                if (p.id) {
                  getCol('products').doc(p.id).update({ stock: newStock }).catch(e => {
                    console.error("Stock update batch sync error:", e);
                  });
                }
                return { ...p, stock: newStock };
              }
              return p;
            });
            setProducts(updatedProducts);

            if (convertingOrderNo) {
              const snap = await getCol('invoices').where('invoiceNumber', '==', convertingOrderNo).get();
              snap.forEach(docSnap => docSnap.ref.delete());
            }
          }

          await getCol('invoices').add(newDoc);

          setShowCheckoutConfirm(false);
          setCart([]);
          setDiscount(0);
          setConvertingOrderNo(null);
          setActiveInvoice(newDoc);
          setShowPrintModal(true);
        } catch (e) {
          // Bugfix 4: Surfacing save errors to user instead of silent console-only logs
          alert("Error saving transaction: " + e.message);
          console.error("Checkout save error:", e);
        }
      };

      const redirectToBillingWithOrder = (salesOrder) => {
        setCart(salesOrder.items || []);
        if (salesOrder.customer) {
          const matchCust = customers.find(c => c.name === salesOrder.customer.name) || salesOrder.customer;
          setSelectedCustomer(matchCust);
          setCustomerSearchQuery(matchCust.name || '');
        }
        setDiscount(salesOrder.discount || 0);
        setDiscountType('amount');
        setPaymentMethod(salesOrder.paymentMethod || 'cash');
        setConvertingOrderNo(salesOrder.invoiceNumber);
        setActiveTab('pos');
      };

      const openAddCustomer = () => {
        setEditingCust(null);
        setCustForm({ name: '', phone: '', email: '', trn: '', address: '' });
        setShowCustModal(true);
      };

      const openEditCustomer = (cust) => {
        setEditingCust(cust);
        setCustForm({
          name: cust.name || '',
          phone: cust.phone || '',
          email: cust.email || '',
          trn: cust.trn || '',
          address: cust.address || ''
        });
        setShowCustModal(true);
      };

      const handleSaveCustomer = async (e) => {
        e.preventDefault();
        if (!custForm.name) return;
        const payload = {
          name: custForm.name,
          phone: custForm.phone || 'N/A',
          email: custForm.email || 'N/A',
          trn: custForm.trn || 'N/A',
          address: custForm.address || 'UAE'
        };
        try {
          if (editingCust && editingCust.id) {
            await getCol('customers').doc(editingCust.id).update(payload); 
          } else {
            const docRef = await getCol('customers').add({ ...payload, createdAt: new Date().toISOString() });
            setSelectedCustomer({ id: docRef.id, ...payload });
            setCustomerSearchQuery(payload.name);
          }
          setShowCustModal(false);
        } catch(err) {
          alert("Error saving customer: " + err.message);
          console.error(err);
        }
      };

      const handleDeleteCustomer = async (cust) => {
        if (!confirm(`Delete customer "${cust.name}"?`)) return;
        if (cust.id) {
          try { await getCol('customers').doc(cust.id).delete(); } catch(e) { console.error(e); }
        }
      };

      const openAddProduct = () => {
        if (currentUser && currentUser.role !== 'admin' && !currentUser.canEditStock) {
          alert("You do not have permission to add or edit stock.");
          return;
        }
        setEditingProd(null);
        setProdForm({ name: '', code: '', price: '', stock: '', category: 'General' });
        setShowProdModal(true);
      };

      const openEditProduct = (prod) => {
        if (currentUser && currentUser.role !== 'admin' && !currentUser.canEditStock) {
          alert("You do not have permission to add or edit stock.");
          return;
        }
        setEditingProd(prod);
        setProdForm({
          name: prod.name || '',
          code: prod.code || '',
          price: prod.price || '',
          stock: prod.stock || 0,
          category: prod.category || 'General'
        });
        setShowProdModal(true);
      };

      const handleSaveProduct = async (e) => {
        e.preventDefault();
        if (!prodForm.name || !prodForm.price) return;
        const payload = {
          name: prodForm.name,
          code: prodForm.code || 'PRD-' + Math.floor(1000 + Math.random() * 9000),
          price: parseFloat(prodForm.price) || 0,
          stock: parseInt(prodForm.stock) || 0,
          vatRate: company.vatPercent,
          category: prodForm.category || 'General'
        };
        try {
          if (editingProd && editingProd.id) {
            await getCol('products').doc(editingProd.id).update(payload);
          } else {
            await getCol('products').add({ ...payload, createdAt: new Date().toISOString() });
          }
          setShowProdModal(false);
        } catch(err) {
          // Bugfix 4: Prevent closing modal on silent failure, alert user directly
          alert("Error saving product: " + err.message);
          console.error("Product save error:", err);
        }
      };

      const handleDeleteProduct = async (prod) => {
        if (currentUser && currentUser.role !== 'admin' && !currentUser.canEditStock) {
          alert("You do not have permission to delete stock.");
          return;
        }
        if (!confirm(`Delete product "${prod.name}"?`)) return;
        if (prod.id) {
          try { await getCol('products').doc(prod.id).delete(); } catch(e) { console.error(e); }
        }
      };

      const openEditBill = (inv) => {
        if (currentUser && currentUser.role !== 'admin' && !currentUser.canDeleteBills) {
          alert("You do not have permission to edit bills.");
          return;
        }
        setEditingBill({
          ...inv,
          customerObj: inv.customer,
          statusVal: inv.status || 'Paid',
          methodVal: inv.paymentMethod || 'cash',
          discountVal: inv.discount || 0
        });
        setShowEditBillModal(true);
      };

      const handleSaveEditedBill = async (e) => {
        e.preventDefault();
        if (!editingBill) return;

        const subtotal = editingBill.subtotal || 0;
        const discAmount = Math.min(parseFloat(editingBill.discountVal) || 0, subtotal);
        const taxable = Math.max(0, subtotal - discAmount);
        const vat = taxable * (company.vatPercent / 100);
        const grand = taxable + vat;

        const updatedPayload = {
          customer: editingBill.customerObj,
          status: editingBill.statusVal,
          paymentMethod: editingBill.methodVal,
          discount: discAmount,
          taxableAmount: taxable,
          vatAmount: vat,
          grandTotal: grand,
          updatedAt: new Date().toISOString()
        };

        if (editingBill.id) {
          try {
            await getCol('invoices').doc(editingBill.id).update(updatedPayload);
          } catch(err) {
            alert("Error updating bill: " + err.message);
            console.error("Cloud edit bill error:", err);
          }
        }
        setShowEditBillModal(false);
      };

      const handleDeleteBill = async (inv) => {
        if (currentUser && currentUser.role !== 'admin' && !currentUser.canDeleteBills) {
          alert("You do not have permission to delete bills.");
          return;
        }
        if (!confirm(`Are you sure you want to delete document ${inv.invoiceNumber}?`)) return;
        
        try {
          if (inv.status === 'Paid' || inv.type === 'Tax Invoice') {
            // Bugfix 3: Robust stock restoration matching precisely by item.id, preventing name/rename mismatches
            const updatedProducts = products.map(p => {
              const itemFound = inv.items?.find(i => i.id === p.id || (i.name && i.name.toLowerCase() === p.name.toLowerCase()));
              if (itemFound) {
                const restoredStock = p.stock + itemFound.qty;
                if (p.id) {
                  getCol('products').doc(p.id).update({ stock: restoredStock }).catch(e => console.error(e));
                }
                return { ...p, stock: restoredStock };
              }
              return p;
            });
            setProducts(updatedProducts);
          }

          if (inv.id) {
            await getCol('invoices').doc(inv.id).delete();
          } else {
            const snap = await getCol('invoices').where('invoiceNumber', '==', inv.invoiceNumber).get();
            snap.forEach(doc => doc.ref.delete());
          }

          setInvoices(prev => prev.filter(i => i.invoiceNumber !== inv.invoiceNumber));
          alert("Bill deleted successfully and inventory stock restored.");
        } catch(e) {
          console.error("Delete bill error:", e);
          alert("Error deleting bill: " + e.message);
        }
      };

      const handleSaveCompany = async () => {
        if (currentUser && currentUser.role !== 'admin') {
          alert("Only Admin can change company settings.");
          return;
        }
        try {
          await getCol('settings').doc('company').set(company);
          alert("Company settings saved to Cloud!");
        } catch(e) {
          alert("Error saving: " + e.message);
        }
      };

      const handleWhatsAppShare = (inv) => {
        const phone = inv.customer?.phone && inv.customer.phone !== 'N/A' ? inv.customer.phone.replace(/[^0-9]/g, '') : '';
        const message = `Hello ${inv.customer?.name},\nHere is your Tax Invoice (${inv.invoiceNumber}) from ${company.name}.\nGrand Total: ${inv.grandTotal.toFixed(2)} AED.\nThank you for your business!`;
        const url = `https://api.whatsapp.com/send?phone=${phone}&text=${encodeURIComponent(message)}`;
        window.open(url, '_blank');
      };

      const handleEmailShare = (inv) => {
        const email = inv.customer?.email && inv.customer.email !== 'N/A' ? inv.customer.email : '';
        const subject = encodeURIComponent(`Tax Invoice ${inv.invoiceNumber} from ${company.name}`);
        const body = encodeURIComponent(`Dear ${inv.customer?.name},\n\nPlease find the summary of your invoice ${inv.invoiceNumber}:\n\nTotal Amount: ${inv.grandTotal.toFixed(2)} AED\n\nThank you for choosing ${company.name}!`);
        window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;
      };

      // --- ADVANCED REPORTS CALCULATIONS & EXPORTS ---
      const filteredInvoicesForReports = useMemo(() => {
        const todayStr = new Date().toISOString().split('T')[0];
        let paidInvs = invoices.filter(i => i.status === 'Paid');
        
        if (reportsDateFilter === 'today') {
          paidInvs = paidInvs.filter(i => i.date && i.date.startsWith(todayStr));
        } else if (reportsDateFilter === 'month') {
          const currentMonth = todayStr.substring(0, 7); 
          paidInvs = paidInvs.filter(i => i.date && i.date.startsWith(currentMonth));
        }

        if (reportsSalesmanFilter !== 'all') {
          paidInvs = paidInvs.filter(i => (i.salesman || 'admin') === reportsSalesmanFilter);
        }

        if (reportsPaymentFilter !== 'all') {
          paidInvs = paidInvs.filter(i => (i.paymentMethod || 'cash') === reportsPaymentFilter);
        }

        if (reportsCustomerFilter !== 'all') {
          paidInvs = paidInvs.filter(i => i.customer?.name === reportsCustomerFilter);
        }

        return paidInvs;
      }, [invoices, reportsDateFilter, reportsSalesmanFilter, reportsPaymentFilter, reportsCustomerFilter]);

      const filteredSettlementsForReports = useMemo(() => {
        const todayStr = new Date().toISOString().split('T')[0];
        let setts = settlements;
        if (reportsDateFilter === 'today') {
          setts = setts.filter(s => s.date && s.date.startsWith(todayStr));
        } else if (reportsDateFilter === 'month') {
          const currentMonth = todayStr.substring(0, 7);
          setts = setts.filter(s => s.date && s.date.startsWith(currentMonth));
        }
        if (reportsCustomerFilter !== 'all') {
          setts = setts.filter(s => s.customerName === reportsCustomerFilter);
        }
        return setts;
      }, [settlements, reportsDateFilter, reportsCustomerFilter]);

      const reportsSummary = useMemo(() => {
        const totalRev = filteredInvoicesForReports.reduce((acc, inv) => acc + (inv.grandTotal || 0), 0);
        const totalSub = filteredInvoicesForReports.reduce((acc, inv) => acc + (inv.subtotal || 0), 0);
        const totalDisc = filteredInvoicesForReports.reduce((acc, inv) => acc + (inv.discount || 0), 0);
        const totalVat = filteredInvoicesForReports.reduce((acc, inv) => acc + (inv.vatAmount || 0), 0);
        const totalBills = filteredInvoicesForReports.length;
        const avgOrderVal = totalBills > 0 ? totalRev / totalBills : 0;
        return { totalRev, totalSub, totalDisc, totalVat, totalBills, avgOrderVal };
      }, [filteredInvoicesForReports]);

      const topSellingItems = useMemo(() => {
        const map = {};
        filteredInvoicesForReports.forEach(inv => {
          inv.items?.forEach(item => {
            if (!map[item.name]) {
              map[item.name] = { name: item.name, qty: 0, revenue: 0 };
            }
            map[item.name].qty += item.qty;
            map[item.name].revenue += (item.price * item.qty);
          });
        });
        return Object.values(map).sort((a, b) => b.revenue - a.revenue);
      }, [filteredInvoicesForReports]);

      const paymentBreakdown = useMemo(() => {
        const map = { cash: 0, card: 0, bank: 0, credit: 0 };
        filteredInvoicesForReports.forEach(inv => {
          const method = inv.paymentMethod || 'cash';
          map[method] = (map[method] || 0) + (inv.grandTotal || 0);
        });
        return map;
      }, [filteredInvoicesForReports]);

      const totalOutstandingCredit = useMemo(() => {
        return customerLedgerSummary.reduce((acc, curr) => acc + curr.balance, 0);
      }, [customerLedgerSummary]);

      const downloadCSV = (filename, csvContent) => {
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', filename);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const exportReportCSV = () => {
        if (reportsSubTab === 'sales_summary' || reportsSubTab === 'vat_report') {
          let csv = 'Invoice Number,Date,Salesman,Customer Name,Customer TRN,Payment Method,Subtotal (AED),Discount (AED),VAT 5% (AED),Grand Total (AED)\n';
          filteredInvoicesForReports.forEach(inv => {
            csv += `"${inv.invoiceNumber}","${new Date(inv.date).toLocaleDateString()}","${inv.salesman || 'admin'}","${inv.customer?.name || ''}","${inv.customer?.trn || ''}","${inv.paymentMethod || 'cash'}",${inv.subtotal?.toFixed(2)},${inv.discount?.toFixed(2)},${inv.vatAmount?.toFixed(2)},${inv.grandTotal?.toFixed(2)}\n`;
          });
          downloadCSV(`Sales_Report_${reportsDateFilter}.csv`, csv);
        } else if (reportsSubTab === 'accounts_report') {
          let csv = 'Customer Name,Mobile,Total Credit Sales (AED),Total Payments Settled (AED),Outstanding Balance (AED)\n';
          customerLedgerSummary.forEach(c => {
            csv += `"${c.customer.name}","${c.customer.phone}",${c.totalCredit.toFixed(2)},${c.totalPaid.toFixed(2)},${c.balance.toFixed(2)}\n`;
          });
          downloadCSV(`Accounts_Receivable_Ledger.csv`, csv);
        } else if (reportsSubTab === 'items_analytics') {
          let csv = 'Product Name,Total Quantity Sold,Total Revenue (AED)\n';
          topSellingItems.forEach(item => {
            csv += `"${item.name}",${item.qty},${item.revenue.toFixed(2)}\n`;
          });
          downloadCSV(`Product_Sales_Analytics.csv`, csv);
        } else if (reportsSubTab === 'salesman_report') {
          let csv = 'Salesman,Total Invoices,Total Sales (AED)\n';
          const salesmen = [...new Set(filteredInvoicesForReports.map(i => i.salesman || 'admin'))];
          salesmen.forEach(sm => {
            const smInvs = filteredInvoicesForReports.filter(i => (i.salesman || 'admin') === sm);
            const total = smInvs.reduce((acc, i) => acc + (i.grandTotal || 0), 0);
            csv += `"${sm}",${smInvs.length},${total.toFixed(2)}\n`;
          });
          downloadCSV(`Salesman_Report_${reportsDateFilter}.csv`, csv);
        }
      };

      const stats = useMemo(() => {
        const todayStr = new Date().toISOString().split('T')[0];
        const activeInvoices = invoices.filter(i => i.status === 'Paid');
        const totalRevenue = activeInvoices.reduce((a, b) => a + (b.grandTotal || 0), 0);
        const totalVat = activeInvoices.reduce((a, b) => a + (b.vatAmount || 0), 0);
        const todaySales = activeInvoices
          .filter(i => i.date && i.date.startsWith(todayStr))
          .reduce((a, b) => a + (b.grandTotal || 0), 0);
        const lowStockCount = products.filter(p => p.stock <= 10).length;
        return { totalRevenue, totalVat, todaySales, count: activeInvoices.length, lowStockCount };
      }, [invoices, products]);

      const salesInvoices = useMemo(() => invoices.filter(i => i.status === 'Paid' || i.status === 'Returned' || i.type === 'Tax Invoice'), [invoices]);
      const salesOrders = useMemo(() => invoices.filter(i => i.status === 'Sales Order' || i.type === 'Sales Order'), [invoices]);

      // --- RENDER LOGIN PAGE IF NOT LOGGED IN ---
      if (!currentUser) {
        return (
          <div className="flex items-center justify-center min-h-screen bg-gray-100 dark:bg-gray-900 p-4">
            <div className="bg-white dark:bg-gray-800 p-6 sm:p-8 rounded-3xl shadow-xl max-w-sm w-full space-y-6 border border-gray-100 dark:border-gray-700">
              <div className="text-center space-y-2">
                <div className="w-14 h-14 bg-brand-600 rounded-2xl mx-auto flex items-center justify-center text-white text-2xl font-bold shadow-lg">🇦🇪</div>
                <h1 className="text-xl font-extrabold dark:text-white">Invoicify UAE</h1>
                <p className="text-xs text-gray-500 dark:text-gray-400">Sign in to your account</p>
              </div>
              <form onSubmit={handleLogin} className="space-y-4 text-xs">
                <div>
                  <label className="font-semibold text-gray-500 dark:text-gray-400 block mb-1">Username</label>
                  <input type="text" required value={loginUsername} onChange={e => setLoginUsername(e.target.value)} placeholder="e.g. admin" className="w-full p-3 bg-gray-50 dark:bg-gray-700 border dark:border-gray-600 rounded-xl dark:text-white" />
                </div>
                <div>
                  <label className="font-semibold text-gray-500 dark:text-gray-400 block mb-1">Password</label>
                  <input type="password" required value={loginPassword} onChange={e => setLoginPassword(e.target.value)} placeholder="••••••••" className="w-full p-3 bg-gray-50 dark:bg-gray-700 border dark:border-gray-600 rounded-xl dark:text-white" />
                </div>
                <button type="submit" className="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3.5 rounded-xl shadow-md cursor-pointer text-sm">Sign In</button>
              </form>
              <div className="text-center text-[11px] text-gray-400">
                Default Admin Login: <strong className="text-gray-600 dark:text-gray-300">admin / admin</strong>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="flex flex-col md:flex-row min-h-screen">
          {/* Sidebar */}
          <aside className="no-print hidden md:flex bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 w-64 flex-shrink-0 flex-col justify-between">
            <div>
              <div className="p-4 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between">
                <div className="flex items-center space-x-3">
                  <div className="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white font-bold text-lg shadow-md">🇦🇪</div>
                  <div>
                    <h1 className="font-bold text-sm leading-tight line-clamp-1 dark:text-white">{company.name}</h1>
                    <span className="text-xs text-gray-500 dark:text-gray-400 capitalize">Role: {currentUser.role}</span>
                  </div>
                </div>
                <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} className="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300">
                  <i data-lucide={theme === 'dark' ? 'sun' : 'moon'} className="w-4 h-4"></i>
                </button>
              </div>

              <nav className="p-3 space-y-1">
                {[
                  { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
                  { id: 'pos', label: 'Create Invoice', icon: 'file-text' },
                  { id: 'invoices', label: 'Invoices & Receipts', icon: 'receipt' },
                  { id: 'accounts', label: 'Accounts & Ledger', icon: 'credit-card' },
                  { id: 'products', label: 'Stock & Inventory', icon: 'package' },
                  { id: 'customers', label: 'Customers', icon: 'users' },
                  ...(currentUser.role === 'admin' || currentUser.canViewReports ? [{ id: 'reports', label: 'Advanced Reports', icon: 'bar-chart-3' }] : []),
                  ...(currentUser.role === 'admin' ? [{ id: 'users_tab', label: 'User Privileges', icon: 'shield' }] : []),
                  ...(currentUser.role === 'admin' ? [{ id: 'settings', label: 'Company Settings', icon: 'settings' }] : []),
                ].map(nav => (
                  <button
                    key={nav.id}
                    onClick={() => setActiveTab(nav.id)}
                    className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg font-medium text-sm transition-all ${
                      activeTab === nav.id ? 'bg-brand-600 text-white shadow-md' : 'text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700/50'
                    }`}>
                    <i data-lucide={nav.icon} className="w-4 h-4"></i>
                    <span>{nav.label}</span>
                  </button>
                ))}
              </nav>
            </div>

            <div className="p-3 border-t border-gray-200 dark:border-gray-700 text-xs space-y-2">
              <div className="flex items-center justify-between">
                <span className="font-bold dark:text-gray-300">👤 {currentUser.username}</span>
                <button onClick={handleLogout} className="text-red-600 font-bold hover:underline">Logout</button>
              </div>
              <div className="flex items-center space-x-2">
                <span className={`w-2 h-2 rounded-full ${syncStatus === 'Cloud Connected' ? 'bg-emerald-500 animate-pulse' : 'bg-amber-500'}`}></span>
                <span className="text-[10px] text-gray-400">{syncStatus}</span>
              </div>
            </div>
          </aside>

          {/* Mobile Top Header */}
          <div className="no-print md:hidden bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 p-3 flex items-center justify-between sticky top-0 z-30 shadow-sm">
            <div className="flex items-center space-x-2">
              <div className="w-8 h-8 rounded-lg bg-brand-600 flex items-center justify-center text-white font-bold text-xs">🇦🇪</div>
              <div>
                <h1 className="font-bold text-xs line-clamp-1 dark:text-white">{currentUser.username} ({currentUser.role})</h1>
                <button onClick={handleLogout} className="text-[10px] text-red-600 font-bold underline">Sign Out</button>
              </div>
            </div>
            <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} className="p-1.5 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300">
              <i data-lucide={theme === 'dark' ? 'sun' : 'moon'} className="w-4 h-4"></i>
            </button>
          </div>

          {/* Main Area */}
          <main className="flex-1 overflow-y-auto p-3 sm:p-4 md:p-6 pb-24 md:pb-6 max-w-full">
            {activeTab === 'dashboard' && (
              <div className="space-y-4 md:space-y-6">
                <div className="flex items-center justify-between">
                  <h2 className="text-lg md:text-2xl font-bold dark:text-white">Sales Overview</h2>
                  <button onClick={() => setActiveTab('pos')} className="bg-brand-600 text-white px-3 py-2 rounded-xl text-xs md:text-sm font-semibold flex items-center space-x-1 shadow">
                    <i data-lucide="plus" className="w-4 h-4"></i>
                    <span>New Bill</span>
                  </button>
                </div>

                <div className="grid grid-cols-2 lg:grid-cols-4 gap-2.5 md:gap-4">
                  <div className="bg-white dark:bg-gray-800 p-3 md:p-4 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm">
                    <span className="text-[10px] md:text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase">Total Revenue</span>
                    <div className="text-base md:text-xl font-extrabold mt-1 dark:text-white">{stats.totalRevenue.toFixed(2)} AED</div>
                  </div>
                  <div className="bg-white dark:bg-gray-800 p-3 md:p-4 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm">
                    <span className="text-[10px] md:text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase">Today's Sales</span>
                    <div className="text-base md:text-xl font-extrabold mt-1 dark:text-white">{stats.todaySales.toFixed(2)} AED</div>
                  </div>
                  <div className="bg-white dark:bg-gray-800 p-3 md:p-4 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm">
                    <span className="text-[10px] md:text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase">Total Outstanding Credit</span>
                    <div className="text-base md:text-xl font-extrabold mt-1 text-amber-600">{totalOutstandingCredit.toFixed(2)} AED</div>
                  </div>
                  <div className="bg-white dark:bg-gray-800 p-3 md:p-4 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm">
                    <span className="text-[10px] md:text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase">Tax Invoices</span>
                    <div className="text-base md:text-xl font-extrabold mt-1 dark:text-white">{stats.count}</div>
                  </div>
                </div>

                {stats.lowStockCount > 0 && (
                  <div className="bg-amber-50 dark:bg-amber-900/30 border border-amber-200 dark:border-amber-800 rounded-xl p-3 flex items-center justify-between text-xs text-amber-800 dark:text-amber-200">
                    <div className="flex items-center space-x-2">
                      <i data-lucide="alert-triangle" className="w-4 h-4 text-amber-600"></i>
                      <span><strong>{stats.lowStockCount} items</strong> low on stock.</span>
                    </div>
                    <button onClick={() => setActiveTab('products')} className="font-bold underline">Check Stock</button>
                  </div>
                )}
              </div>
            )}

            {activeTab === 'pos' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-4 md:gap-6">
                <div className="lg:col-span-7 space-y-3 md:space-y-4">
                  <div className="flex items-center justify-between">
                    <h2 className="text-base md:text-xl font-bold dark:text-white">Select Items</h2>
                    <input type="text" placeholder="Search items..." value={searchProduct} onChange={(e) => setSearchProduct(e.target.value)} className="p-1.5 md:p-2 text-xs bg-white dark:bg-gray-800 border dark:border-gray-700 rounded-xl w-36 md:w-48 dark:text-white" />
                  </div>
                  
                  {convertingOrderNo && (
                    <div className="bg-amber-50 dark:bg-amber-900/30 border border-amber-200 dark:border-amber-700 p-2 rounded-xl text-xs flex justify-between items-center text-amber-800 dark:text-amber-200">
                      <span>⚡ Converting Pre-Order: <strong>{convertingOrderNo}</strong></span>

          {/* EDIT USER PRIVILEGES MODAL */}
          {showEditUserModal && editingUser && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-3">
              <div className="bg-white dark:bg-gray-800 p-5 rounded-2xl max-w-md w-full shadow-2xl space-y-3">
                <h3 className="font-bold text-sm dark:text-white">Edit User: {editingUser.username}</h3>
                <form onSubmit={handleSaveEditedUser} className="space-y-3 text-xs">
                  <div>
                    <label className="font-semibold text-gray-500 dark:text-gray-400">Password</label>
                    <input type="text" required value={editingUser.password} onChange={e => setEditingUser({ ...editingUser, password: e.target.value })} className="w-full p-2 border dark:border-gray-700 rounded mt-1 dark:bg-gray-700 dark:text-white" />
                  </div>
                  <div>
                    <label className="font-semibold text-gray-500 dark:text-gray-400">Role</label>
                    <select value={editingUser.role} onChange={e => setEditingUser({ ...editingUser, role: e.target.value })} className="w-full p-2 border dark:border-gray-700 rounded mt-1 dark:bg-gray-700 dark:text-white">
                      <option value="salesman">Salesman / Staff</option>
                      <option value="admin">Admin</option>
                    </select>
                  </div>
                  <div className="space-y-2 pt-2 border-t dark:border-gray-700">
                    <label className="flex items-center space-x-2 cursor-pointer">
                      <input type="checkbox" checked={editingUser.canEditStock} onChange={e => setEditingUser({ ...editingUser, canEditStock: e.target.checked })} className="rounded" />
                      <span className="dark:text-white">Privilege: Can Add / Edit / Delete Stock</span>
                    </label>
                    <label className="flex items-center space-x-2 cursor-pointer">
                      <input type="checkbox" checked={editingUser.canDeleteBills} onChange={e => setEditingUser({ ...editingUser, canDeleteBills: e.target.checked })} className="rounded" />
                      <span className="dark:text-white">Privilege: Can Edit / Delete Bills</span>
                    </label>
                    <label className="flex items-center space-x-2 cursor-pointer">
                      <input type="checkbox" checked={editingUser.canViewReports} onChange={e => setEditingUser({ ...editingUser, canViewReports: e.target.checked })} className="rounded" />
                      <span className="dark:text-white">Privilege: Can View Reports Hub</span>
                    </label>
                  </div>
                  <div className="flex justify-end space-x-2 pt-2">
                    <button type="button" onClick={() => setShowEditUserModal(false)} className="px-3 py-1.5 bg-gray-200 dark:bg-gray-700 dark:text-white rounded">Cancel</button>
                    <button type="submit" className="px-3 py-1.5 bg-brand-600 text-white rounded font-bold">Save Changes</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* CREATE USER MODAL */}
          {showUserModal && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-3">
              <div className="bg-white dark:bg-gray-800 p-5 rounded-2xl max-w-md w-full shadow-2xl space-y-3">
                <h3 className="font-bold text-sm dark:text-white">Create New User Account</h3>
                <form onSubmit={handleCreateUser} className="space-y-3 text-xs">
                  <div>
                    <label className="font-semibold text-gray-500 dark:text-gray-400">Username *</label>
                    <input type="text" required value={newUserForm.username} onChange={e => setNewUserForm({ ...newUserForm, username: e.target.value })} className="w-full p-2 border dark:border-gray-700 rounded mt-1 dark:bg-gray-700 dark:text-white" />
                  </div>
                  <div>
                    <label className="font-semibold text-gray-500 dark:text-gray-400">Password *</label>
                    <input type="text" required value={newUserForm.password} onChange={e => setNewUserForm({ ...newUserForm, password: e.target.value })} className="w-full p-2 border dark:border-gray-700 rounded mt-1 dark:bg-gray-700 dark:text-white" />
                  </div>
                  <div>
                    <label className="font-semibold text-gray-500 dark:text-gray-400">Role</label>
                    <select value={newUserForm.role} onChange={e => setNewUserForm({ ...newUserForm, role: e.target.value })} className="w-full p-2 border dark:border-gray-700 rounded mt-1 dark:bg-gray-700 dark:text-white">
                      <option value="salesman">Salesman / Staff</option>
                      <option value="admin">Admin</option>
                    </select>
                  </div>
                  <div className="space-y-2 pt-2 border-t dark:border-gray-700">
                    <label className="flex items-center space-x-2 cursor-pointer">
                      <input type="checkbox" checked={newUserForm.canEditStock} onChange={e => setNewUserForm({ ...newUserForm, canEditStock: e.target.checked })} className="rounded" />
                      <span className="dark:text-white">Privilege: Can Add / Edit / Delete Stock</span>
                    </label>
                    <label className="flex items-center space-x-2 cursor-pointer">
                      <input type="checkbox" checked={newUserForm.canDeleteBills} onChange={e => setNewUserForm({ ...newUserForm, canDeleteBills: e.target.checked })} className="rounded" />
                      <span className="dark:text-white">Privilege: Can Edit / Delete Bills</span>
                    </label>
                    <label className="flex items-center space-x-2 cursor-pointer">
                      <input type="checkbox" checked={newUserForm.canViewReports} onChange={e => setNewUserForm({ ...newUserForm, canViewReports: e.target.checked })} className="rounded" />
                      <span className="dark:text-white">Privilege: Can View Reports Hub</span>
                    </label>
                  </div>
                  <div className="flex justify-end space-x-2 pt-2">
                    <button type="button" onClick={() => setShowUserModal(false)} className="px-3 py-1.5 bg-gray-200 dark:bg-gray-700 dark:text-white rounded">Cancel</button>
                    <button type="submit" className="px-3 py-1.5 bg-brand-600 text-white rounded font-bold">Create User</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* CHANGE ADMIN PASSWORD MODAL */}
          {showChangePassModal && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-3">
              <div className="bg-white dark:bg-gray-800 p-5 rounded-2xl max-w-sm w-full shadow-2xl space-y-3">
                <h3 className="font-bold text-sm dark:text-white">Change Admin Password</h3>
                <form onSubmit={handleUpdateAdminPassword} className="space-y-3 text-xs">
                  <div>
                    <label className="font-semibold text-gray-500 dark:text-gray-400">New Admin Password</label>
                    <input type="text" required value={adminNewPass} onChange={e => setAdminNewPass(e.target.value)} placeholder="Enter new password" className="w-full p-2 border dark:border-gray-700 rounded mt-1 dark:bg-gray-700 dark:text-white" />
                  </div>
                  <div className="flex justify-end space-x-2 pt-2">
                    <button type="button" onClick={() => setShowChangePassModal(false)} className="px-3 py-1.5 bg-gray-200 dark:bg-gray-700 dark:text-white rounded">Cancel</button>
                    <button type="submit" className="px-3 py-1.5 bg-brand-600 text-white rounded font-bold">Update Password</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* CHECKOUT MODAL */}
          {showCheckoutConfirm && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center p-3">
              <div className="bg-white dark:bg-gray-800 p-5 rounded-t-3xl sm:rounded-2xl max-w-md w-full shadow-2xl space-y-4">
                <h3 className="font-bold text-sm dark:text-white">Save Transaction</h3>
                <div className="space-y-2">
                  <button onClick={() => confirmAndSaveOrder('TAX_INVOICE')} className="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl text-xs cursor-pointer">Save & Finalize Official Tax Invoice</button>
                  <button onClick={() => confirmAndSaveOrder('SALES_ORDER')} className="w-full bg-amber-600 text-white font-bold py-3 rounded-xl text-xs cursor-pointer">Save as Sales Order (Draft)</button>
                  <button onClick={() => setShowCheckoutConfirm(false)} className="w-full bg-gray-200 dark:bg-gray-700 dark:text-gray-200 py-2 rounded-xl text-xs">Cancel</button>
                </div>
              </div>
            </div>
          )}

          {/* EDIT BILL MODAL */}
          {showEditBillModal && editingBill && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-3">
              <div className="bg-white dark:bg-gray-800 p-5 rounded-2xl max-w-md w-full shadow-2xl space-y-3">
                <h3 className="font-bold text-sm dark:text-white">Edit Document #{editingBill.invoiceNumber}</h3>
                <form onSubmit={handleSaveEditedBill} className="space-y-3 text-xs">
                  <div>
                    <label className="font-semibold text-gray-500 dark:text-gray-400">Status</label>
                    <select value={editingBill.statusVal} onChange={e => setEditingBill({ ...editingBill, statusVal: e.target.value })} className="w-full p-2 border dark:border-gray-700 rounded mt-1 dark:bg-gray-700 dark:text-white">
                      <option value="Paid">Paid (Tax Invoice)</option>
                      <option value="Sales Order">Sales Order (Draft)</option>
                      <option value="Returned">Returned</option>
                    </select>
                  </div>
                  <div>
                    <label className="font-semibold text-gray-500 dark:text-gray-400">Discount (AED)</label>
                    <input type="number" step="0.01" value={editingBill.discountVal} onChange={e => setEditingBill({ ...editingBill, discountVal: e.target.value })} className="w-full p-2 border dark:border-gray-700 rounded mt-1 dark:bg-gray-700 dark:text-white" />
                  </div>
                  <div className="flex justify-end space-x-2 pt-2">
                    <button type="button" onClick={() => setShowEditBillModal(false)} className="px-3 py-1.5 bg-gray-200 dark:bg-gray-700 dark:text-white rounded">Cancel</button>
                    <button type="submit" className="px-3 py-1.5 bg-brand-600 text-white rounded font-bold">Update Bill</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* PRODUCT MODAL */}
          {showProdModal && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-3">
              <div className="bg-white dark:bg-gray-800 p-5 rounded-2xl max-w-md w-full shadow-2xl space-y-3">
                <h3 className="font-bold text-sm dark:text-white">{editingProd ? 'Edit Product' : 'Add Product'}</h3>
                <form onSubmit={handleSaveProduct} className="space-y-3 text-xs">
                  <div>
                    <label className="font-semibold text-gray-500 dark:text-gray-400">Product Name *</label>
                    <input type="text" required value={prodForm.name} onChange={e => setProdForm({ ...prodForm, name: e.target.value })} className="w-full p-2 border dark:border-gray-700 rounded mt-1 dark:bg-gray-700 dark:text-white" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-semibold text-gray-500 dark:text-gray-400">Code / SKU</label>
                      <input type="text" placeholder="e.g. PRD-01" value={prodForm.code} onChange={e => setProdForm({ ...prodForm, code: e.target.value })} className="w-full p-2 border dark:border-gray-700 rounded mt-1 dark:bg-gray-700 dark:text-white font-mono" />
                    </div>
                    <div>
                      <label className="font-semibold text-gray-500 dark:text-gray-400">Price (AED) *</label>
                      <input type="number" step="0.01" required value={prodForm.price} onChange={e => setProdForm({ ...prodForm, price: e.target.value })} className="w-full p-2 border dark:border-gray-700 rounded mt-1 dark:bg-gray-700 dark:text-white" />
                    </div>
                  </div>
                  <div>
                    <label className="font-semibold text-gray-500 dark:text-gray-400">Initial Stock Quantity</label>
                    <input type="number" value={prodForm.stock} onChange={e => setProdForm({ ...prodForm, stock: e.target.value })} className="w-full p-2 border dark:border-gray-700 rounded mt-1 dark:bg-gray-700 dark:text-white" />
                  </div>
                  <div className="flex justify-end space-x-2 pt-2">
                    <button type="button" onClick={() => setShowProdModal(false)} className="px-3 py-1.5 bg-gray-200 dark:bg-gray-700 dark:text-white rounded">Cancel</button>
                    <button type="submit" className="px-3 py-1.5 bg-brand-600 text-white rounded font-bold">{editingProd ? 'Update Product' : 'Save Product'}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* CUSTOMER MODAL */}
          {showCustModal && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-3">
              <div className="bg-white dark:bg-gray-800 p-5 rounded-2xl max-w-md w-full shadow-2xl space-y-3">
                <h3 className="font-bold text-sm dark:text-white">{editingCust ? 'Edit Customer Profile' : 'Add Customer Profile'}</h3>
                <form onSubmit={handleSaveCustomer} className="space-y-3 text-xs">
                  <div>
                    <label className="font-semibold text-gray-500 dark:text-gray-400">Customer / Business Name *</label>
                    <input type="text" required value={custForm.name} onChange={e => setCustForm({ ...custForm, name: e.target.value })} className="w-full p-2 border dark:border-gray-700 rounded mt-1 dark:bg-gray-700 dark:text-white" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-semibold text-gray-500 dark:text-gray-400">Mobile Number</label>
                      <input type="text" placeholder="+971 50..." value={custForm.phone} onChange={e => setCustForm({ ...custForm, phone: e.target.value })} className="w-full p-2 border dark:border-gray-700 rounded mt-1 dark:bg-gray-700 dark:text-white" />
                    </div>
                    <div>
                      <label className="font-semibold text-gray-500 dark:text-gray-400">Email ID</label>
                      <input type="email" placeholder="name@domain.com" value={custForm.email} onChange={e => setCustForm({ ...custForm, email: e.target.value })} className="w-full p-2 border dark:border-gray-700 rounded mt-1 dark:bg-gray-700 dark:text-white" />
                    </div>
                  </div>
                  <div>
                    <label className="font-semibold text-gray-500 dark:text-gray-400">UAE TRN Number</label>
                    <input type="text" value={custForm.trn} onChange={e => setCustForm({ ...custForm, trn: e.target.value })} className="w-full p-2 border dark:border-gray-700 rounded mt-1 font-mono dark:bg-gray-700 dark:text-white" />
                  </div>
                  <div>
                    <label className="font-semibold text-gray-500 dark:text-gray-400">Address</label>
                    <input type="text" value={custForm.address} onChange={e => setCustForm({ ...custForm, address: e.target.value })} className="w-full p-2 border dark:border-gray-700 rounded mt-1 dark:bg-gray-700 dark:text-white" />
                  </div>
                  <div className="flex justify-end space-x-2 pt-2">
                    <button type="button" onClick={() => setShowCustModal(false)} className="px-3 py-1.5 bg-gray-200 dark:bg-gray-700 dark:text-white rounded">Cancel</button>
                    <button type="submit" className="px-3 py-1.5 bg-brand-600 text-white rounded font-bold">{editingCust ? 'Update Customer' : 'Save Customer'}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* PROFESSIONAL A4 PRINT & SHARE RECEIPT MODAL */}
          {showPrintModal && activeInvoice && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-3">
              <div className="bg-white p-6 rounded-2xl max-w-lg w-full text-black shadow-2xl max-h-[90vh] overflow-y-auto">
                <div id="printable-area" className="text-xs space-y-4 font-sans bg-white p-6 text-black">
                  <div className="flex justify-between items-start border-b pb-4">
                    <div>
                      <h2 className="font-black text-lg tracking-wide uppercase text-brand-700">{activeInvoice.company?.name || 'COMPANY NAME'}</h2>
                      <p className="text-[11px] text-gray-600 mt-0.5">{activeInvoice.company?.address || 'UAE'}</p>
                      <p className="text-[11px] text-gray-600">Phone: {activeInvoice.company?.phone || 'N/A'} | Email: {activeInvoice.company?.email || 'N/A'}</p>
                      <p className="font-bold text-[11px] mt-1">TRN: {activeInvoice.company?.trn || 'N/A'}</p>
                    </div>
                    <div className="text-right">
                      <h3 className="font-extrabold text-base tracking-wider uppercase text-gray-900">{activeInvoice.type || 'Tax Invoice'}</h3>
                      <p className="font-mono font-bold text-sm text-brand-600 mt-1">{activeInvoice.invoiceNumber}</p>
                      <p className="text-[11px] text-gray-500 mt-0.5">Date: {new Date(activeInvoice.date).toLocaleDateString()}</p>
                      <p className="text-[11px] text-gray-500">Salesman: <strong>{activeInvoice.salesman || 'admin'}</strong></p>
                      {activeInvoice.preOrderReference && <p className="text-[10px] text-emerald-700 font-bold mt-1">Pre-Order Ref: {activeInvoice.preOrderReference}</p>}
                    </div>
                  </div>

                  <div className="bg-gray-50 p-3 rounded-xl border border-gray-100 text-[11px] space-y-1">
                    <div className="font-bold text-gray-700 uppercase tracking-wider mb-1">Billed To / Bill To:</div>
                    <div className="font-bold text-sm">{activeInvoice.customer?.name}</div>
                    <div>Address: {activeInvoice.customer?.address || 'UAE'}</div>
                    <div className="flex justify-between">
                      <span>Mobile: <strong>{activeInvoice.customer?.phone}</strong></span>
                      <span>TRN: <strong className="font-mono">{activeInvoice.customer?.trn || 'N/A'}</strong></span>
                    </div>
                  </div>

                  <table className="w-full text-left border-collapse">
                    <thead>
                      <tr className="border-b-2 border-gray-800 text-[10px] uppercase bg-gray-100">
                        <th className="py-2 px-2">Item Description</th>
                        <th className="py-2 px-2 text-center">Qty</th>
                        <th className="py-2 px-2 text-right">Price</th>
                        <th className="py-2 px-2 text-right">Total (AED)</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-gray-200">
                      {activeInvoice.items?.map((item, idx) => (
                        <tr key={idx}>
                          <td className="py-2.5 px-2 font-medium">{item.name}</td>
                          <td className="py-2.5 px-2 text-center font-bold">{item.qty}</td>
                          <td className="py-2.5 px-2 text-right">{item.price.toFixed(2)}</td>
                          <td className="py-2.5 px-2 text-right font-bold">{(item.price * item.qty).toFixed(2)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>

                  <div className="flex justify-end pt-2 border-t border-gray-300">
                    <div className="w-60 space-y-1.5 text-[11px]">
                      <div className="flex justify-between"><span>Subtotal:</span><span>{activeInvoice.subtotal?.toFixed(2)} AED</span></div>
                      {activeInvoice.discount > 0 && <div className="flex justify-between text-red-600"><span>Discount:</span><span>-{activeInvoice.discount?.toFixed(2)} AED</span></div>}
                      <div className="flex justify-between"><span>VAT ({activeInvoice.company?.vatPercent || 5}%):</span><span>{activeInvoice.vatAmount?.toFixed(2)} AED</span></div>
                      <div className="flex justify-between font-extrabold text-sm border-t-2 border-gray-800 pt-1 mt-1">
                        <span>Grand Total:</span>
                        <span className="text-brand-700">{activeInvoice.grandTotal?.toFixed(2)} AED</span>
                      </div>
                    </div>
                  </div>

                  <div className="text-center text-[10px] text-gray-500 pt-4 border-t mt-6">
                    Thank you for your business! / شكراً لتعاملكم معنا<br/>
                    This is a computer-generated electronic tax invoice.
                  </div>
                </div>

                <div className="no-print flex flex-wrap items-center justify-between gap-2 mt-5 pt-3 border-t">
                  <div className="flex space-x-1.5">
                    <button onClick={() => handleWhatsAppShare(activeInvoice)} className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-bold flex items-center space-x-1 shadow" title="Share via WhatsApp">
                      <span>💬 WhatsApp</span>
                    </button>
                    <button onClick={() => handleEmailShare(activeInvoice)} className="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-bold flex items-center space-x-1 shadow" title="Share via Email">
                      <span>✉️ Email</span>
                    </button>
                  </div>
                  <div className="flex space-x-2">
                    <button onClick={() => setShowPrintModal(false)} className="px-3 py-1.5 bg-gray-200 rounded-lg text-xs font-bold">Close</button>
                    <button onClick={() => window.print()} className="px-4 py-1.5 bg-brand-600 text-white rounded-lg text-xs font-bold flex items-center space-x-1 shadow">
                      <i data-lucide="printer" className="w-4 h-4"></i>
                      <span>Print / PDF</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
