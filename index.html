<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Invoicify - UAE Billing & Inventory System</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0284c7',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase JS SDK v11 Modular Bundle Setup -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDc113ArrZa-bBCvKl-3UEwi4pIAdtwmIA",
      authDomain: "tharavad336.firebaseapp.com",
      projectId: "tharavad336",
      storageBucket: "tharavad336.firebasestorage.app",
      messagingSenderId: "124534840254",
      appId: "1:124534840254:web:825d9c694eea1934d977ef",
      measurementId: "G-XZ92F73DVT"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // Make Firebase globally accessible for React
    window.FirebaseServices = {
      db,
      auth,
      collection,
      addDoc,
      onSnapshot,
      doc,
      updateDoc,
      deleteDoc,
      signInAnonymously,
      onAuthStateChanged
    };

    // Dispatch event so React knows Firebase SDK is ready
    window.dispatchEvent(new Event('firebase-ready'));
  </script>

  <style>
    @media print {
      body * { visibility: hidden; }
      #printable-area, #printable-area * { visibility: visible; }
      #printable-area {
        position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 12px;
        color: #000 !important; background: #fff !important;
      }
      .no-print { display: none !important; }
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const INITIAL_PRODUCTS = [
      { id: 'p1', name: 'Premium Coffee Beans (1kg)', code: 'PRD-01', price: 85.00, vatRate: 5, stock: 42, category: 'Beverages' },
      { id: 'p2', name: 'Organic Almond Milk 1L', code: 'PRD-02', price: 18.50, vatRate: 5, stock: 15, category: 'Beverages' },
      { id: 'p3', name: 'Espresso Machine Cleaning Powder', code: 'PRD-03', price: 45.00, vatRate: 5, stock: 8, category: 'Maintenance' },
      { id: 'p4', name: 'Takeaway Cup 12oz (Pack of 50)', code: 'PRD-04', price: 32.00, vatRate: 5, stock: 120, category: 'Packaging' },
    ];

    const INITIAL_CUSTOMERS = [
      { id: 'c1', name: 'Al Maskoor Trading LLC', phone: '+971 50 123 4567', email: 'billing@almaskoor.ae', trn: '100239482700003', address: 'Business Bay, Dubai' },
      { id: 'c2', name: 'Walk-in Customer', phone: 'N/A', email: 'N/A', trn: 'N/A', address: 'Abu Dhabi, UAE' }
    ];

    function App() {
      const [theme, setTheme] = useState(localStorage.getItem('theme') || 'light');
      const [activeTab, setActiveTab] = useState('dashboard');
      const [syncStatus, setSyncStatus] = useState('connecting'); 
      const [currentUser, setCurrentUser] = useState(null);

      const [company, setCompany] = useState({
        name: 'FLOURISH CAFE & TRADING LLC',
        trn: '100392817400003',
        phone: '+971 4 888 9999',
        email: 'info@flourish.ae',
        address: 'Sheikh Zayed Road, Dubai, UAE',
        currency: 'AED',
        vatPercent: 5
      });

      const [products, setProducts] = useState(() => {
        const local = localStorage.getItem('inv_products');
        return local ? JSON.parse(local) : INITIAL_PRODUCTS;
      });
      const [customers, setCustomers] = useState(() => {
        const local = localStorage.getItem('inv_customers');
        return local ? JSON.parse(local) : INITIAL_CUSTOMERS;
      });
      const [invoices, setInvoices] = useState(() => {
        const local = localStorage.getItem('inv_invoices');
        return local ? JSON.parse(local) : [];
      });

      const [cart, setCart] = useState([]);
      const [selectedCustomer, setSelectedCustomer] = useState(INITIAL_CUSTOMERS[1]);
      const [discount, setDiscount] = useState(0);
      const [discountType, setDiscountType] = useState('amount');
      const [paymentMethod, setPaymentMethod] = useState('cash');
      const [searchProduct, setSearchProduct] = useState('');

      const [activeInvoice, setActiveInvoice] = useState(null);
      const [showPrintModal, setShowPrintModal] = useState(false);
      const [searchInvoice, setSearchInvoice] = useState('');
      const [invoiceFilter, setInvoiceFilter] = useState('all');

      useEffect(() => {
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        localStorage.setItem('theme', theme);
      }, [theme]);

      // Step 1: Initialize Firebase Auth FIRST
      useEffect(() => {
        const startAuth = async () => {
          if (!window.FirebaseServices) return;
          const { auth, signInAnonymously, onAuthStateChanged } = window.FirebaseServices;

          try {
            await signInAnonymously(auth);
          } catch (e) {
            console.error("Auth initialization error:", e);
            setSyncStatus('offline');
          }

          const unsubscribe = onAuthStateChanged(auth, (user) => {
            if (user) {
              setCurrentUser(user);
              setSyncStatus('synced');
            } else {
              setSyncStatus('offline');
            }
          });

          return () => unsubscribe();
        };

        if (window.FirebaseServices) {
          startAuth();
        } else {
          window.addEventListener('firebase-ready', startAuth);
        }

        return () => window.removeEventListener('firebase-ready', startAuth);
      }, []);

      // Step 2: Fetch and Sync Data ONLY AFTER User is Authenticated
      useEffect(() => {
        if (!currentUser || !window.FirebaseServices) return;
        const { db, collection, onSnapshot } = window.FirebaseServices;

        // Path standard for public collections
        const invoicesRef = collection(db, 'artifacts', 'invoicify_app', 'public', 'data', 'invoices');

        const unsubscribe = onSnapshot(
          invoicesRef,
          (snapshot) => {
            const cloudData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            if (cloudData.length > 0) {
              setInvoices(cloudData);
              localStorage.setItem('inv_invoices', JSON.stringify(cloudData));
            }
            setSyncStatus('synced');
          },
          (error) => {
            console.warn("Firestore snapshot error (Using local backup):", error);
            setSyncStatus('offline');
          }
        );

        return () => unsubscribe();
      }, [currentUser]);

      useEffect(() => { localStorage.setItem('inv_products', JSON.stringify(products)); }, [products]);
      useEffect(() => { localStorage.setItem('inv_customers', JSON.stringify(customers)); }, [customers]);
      useEffect(() => { localStorage.setItem('inv_invoices', JSON.stringify(invoices)); }, [invoices]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      const cartCalculations = useMemo(() => {
        const subtotal = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
        let discAmount = 0;
        if (discountType === 'amount') {
          discAmount = Math.min(discount, subtotal);
        } else {
          discAmount = (subtotal * Math.min(discount, 100)) / 100;
        }
        const netTaxable = Math.max(0, subtotal - discAmount);
        const vatTotal = netTaxable * (company.vatPercent / 100);
        const grandTotal = netTaxable + vatTotal;

        return { subtotal, discAmount, netTaxable, vatTotal, grandTotal };
      }, [cart, discount, discountType, company.vatPercent]);

      const addToCart = (product) => {
        if (product.stock <= 0) {
          alert('Warning: Product is out of stock!');
          return;
        }
        const existing = cart.find(i => i.id === product.id);
        if (existing) {
          if (existing.qty >= product.stock) {
            alert(`Cannot add more. Stock limit (${product.stock}) reached.`);
            return;
          }
          setCart(cart.map(i => i.id === product.id ? { ...i, qty: i.qty + 1 } : i));
        } else {
          setCart([...cart, { ...product, qty: 1 }]);
        }
      };

      const updateCartQty = (id, newQty) => {
        const prod = products.find(p => p.id === id);
        if (newQty > prod.stock) {
          alert(`Stock limit reached! Max available: ${prod.stock}`);
          return;
        }
        if (newQty <= 0) {
          setCart(cart.filter(i => i.id !== id));
        } else {
          setCart(cart.map(i => i.id === id ? { ...i, qty: newQty } : i));
        }
      };

      const handleCheckout = async () => {
        if (cart.length === 0) {
          alert("Please add items to invoice before checking out.");
          return;
        }

        const invoiceNum = `INV-${new Date().getFullYear()}-${String(invoices.length + 1).padStart(4, '0')}`;
        const newInvoice = {
          invoiceNumber: invoiceNum,
          date: new Date().toISOString(),
          customer: selectedCustomer,
          items: cart,
          company: company,
          subtotal: cartCalculations.subtotal,
          discount: cartCalculations.discAmount,
          taxableAmount: cartCalculations.netTaxable,
          vatAmount: cartCalculations.vatTotal,
          vatRate: company.vatPercent,
          grandTotal: cartCalculations.grandTotal,
          paymentMethod: paymentMethod,
          status: 'Paid'
        };

        const updatedProducts = products.map(p => {
          const cartItem = cart.find(c => c.id === p.id);
          if (cartItem) {
            return { ...p, stock: p.stock - cartItem.qty };
          }
          return p;
        });

        setProducts(updatedProducts);
        const updatedInvoices = [newInvoice, ...invoices];
        setInvoices(updatedInvoices);

        // Step 3: Write to Firestore Cloud ONLY IF Auth is active
        if (currentUser && window.FirebaseServices) {
          const { db, collection, addDoc } = window.FirebaseServices;
          try {
            await addDoc(
              collection(db, 'artifacts', 'invoicify_app', 'public', 'data', 'invoices'),
              newInvoice
            );
            console.log("Successfully saved to Firebase Cloud!");
          } catch (err) {
            console.error("Cloud Save Failed. Local backup preserved:", err);
            alert("Could not sync to Cloud. Stored locally on device.");
          }
        }

        setCart([]);
        setDiscount(0);
        setActiveInvoice(newInvoice);
        setShowPrintModal(true);
      };

      const handleReturnInvoice = (inv) => {
        if (!confirm(`Are you sure you want to refund/cancel Invoice ${inv.invoiceNumber}? Stock will be restored.`)) return;

        const updatedProducts = products.map(p => {
          const cartItem = inv.items.find(i => i.id === p.id);
          if (cartItem) {
            return { ...p, stock: p.stock + cartItem.qty };
          }
          return p;
        });

        const updatedInvoices = invoices.map(i => i.invoiceNumber === inv.invoiceNumber ? { ...i, status: 'Returned' } : i);
        setProducts(updatedProducts);
        setInvoices(updatedInvoices);
      };

      const stats = useMemo(() => {
        const todayStr = new Date().toISOString().split('T')[0];
        const activeInvoices = invoices.filter(i => i.status !== 'Returned');

        const totalRevenue = activeInvoices.reduce((a, b) => a + b.grandTotal, 0);
        const totalVat = activeInvoices.reduce((a, b) => a + b.vatAmount, 0);
        const todaySales = activeInvoices
          .filter(i => i.date && i.date.startsWith(todayStr))
          .reduce((a, b) => a + b.grandTotal, 0);
        
        const lowStockCount = products.filter(p => p.stock <= 10).length;

        return { totalRevenue, totalVat, todaySales, count: activeInvoices.length, lowStockCount };
      }, [invoices, products]);

      return (
        <div className="flex flex-col md:flex-row min-h-screen">
          <aside className="no-print bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 w-full md:w-64 flex-shrink-0 flex flex-col justify-between">
            <div>
              <div className="p-4 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between">
                <div className="flex items-center space-x-3">
                  <div className="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white font-bold text-lg shadow-md shadow-brand-500/30">
                    🇦🇪
                  </div>
                  <div>
                    <h1 className="font-bold text-sm leading-tight line-clamp-1">{company.name}</h1>
                    <span className="text-xs text-gray-500 dark:text-gray-400">TRN: {company.trn}</span>
                  </div>
                </div>
                <button 
                  onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
                  className="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:opacity-80">
                  <i data-lucide={theme === 'dark' ? 'sun' : 'moon'} className="w-4 h-4"></i>
                </button>
              </div>

              <nav className="p-3 space-y-1">
                {[
                  { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
                  { id: 'pos', label: 'Create Invoice', icon: 'file-text' },
                  { id: 'invoices', label: 'Invoices & Bills', icon: 'receipt' },
                  { id: 'products', label: 'Products & Stock', icon: 'package' },
                  { id: 'customers', label: 'Customers', icon: 'users' },
                  { id: 'reports', label: 'Reports & Settings', icon: 'bar-chart-3' },
                ].map(nav => (
                  <button
                    key={nav.id}
                    onClick={() => setActiveTab(nav.id)}
                    className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg font-medium text-sm transition-all ${
                      activeTab === nav.id 
                        ? 'bg-brand-600 text-white shadow-md shadow-brand-600/20' 
                        : 'text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700/50'
                    }`}>
                    <i data-lucide={nav.icon} className="w-4 h-4"></i>
                    <span>{nav.label}</span>
                    {nav.id === 'products' && stats.lowStockCount > 0 && (
                      <span className="ml-auto bg-amber-500 text-white text-[10px] px-1.5 py-0.5 rounded-full font-bold">
                        {stats.lowStockCount}
                      </span>
                    )}
                  </button>
                ))}
              </nav>
            </div>

            <div className="p-3 border-t border-gray-200 dark:border-gray-700 text-xs text-gray-500 dark:text-gray-400 flex items-center justify-between">
              <div className="flex items-center space-x-2">
                <span className={`w-2.5 h-2.5 rounded-full ${syncStatus === 'synced' ? 'bg-emerald-500 animate-pulse' : 'bg-amber-500'}`}></span>
                <span className="capitalize font-semibold">{syncStatus === 'synced' ? 'Cloud Connected' : 'Offline Storage'}</span>
              </div>
              <span className="text-[10px] bg-gray-100 dark:bg-gray-700 px-1.5 py-0.5 rounded font-mono">UAE VAT</span>
            </div>
          </aside>

          <main className="flex-1 overflow-y-auto p-4 md:p-6 mb-16 md:mb-0">
            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                <div className="flex items-center justify-between">
                  <div>
                    <h2 className="text-2xl font-bold">Sales & Revenue Dashboard</h2>
                    <p className="text-sm text-gray-500">Real-time overview of business performance</p>
                  </div>
                  <button 
                    onClick={() => setActiveTab('pos')}
                    className="bg-brand-600 text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-brand-700 flex items-center space-x-2 shadow-lg shadow-brand-600/20">
                    <i data-lucide="plus" className="w-4 h-4"></i>
                    <span>New Bill</span>
                  </button>
                </div>

                <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                  <div className="bg-white dark:bg-gray-800 p-4 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm">
                    <div className="flex items-center justify-between text-gray-500 mb-2">
                      <span className="text-xs font-semibold uppercase">Total Revenue</span>
                      <i data-lucide="dollar-sign" className="w-4 h-4 text-emerald-500"></i>
                    </div>
                    <div className="text-xl font-extrabold">{stats.totalRevenue.toFixed(2)} <span className="text-xs font-normal">AED</span></div>
                    <span className="text-[11px] text-emerald-600 font-medium">Incl. VAT</span>
                  </div>

                  <div className="bg-white dark:bg-gray-800 p-4 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm">
                    <div className="flex items-center justify-between text-gray-500 mb-2">
                      <span className="text-xs font-semibold uppercase">Today's Sales</span>
                      <i data-lucide="trending-up" className="w-4 h-4 text-brand-500"></i>
                    </div>
                    <div className="text-xl font-extrabold">{stats.todaySales.toFixed(2)} <span className="text-xs font-normal">AED</span></div>
                    <span className="text-[11px] text-gray-400">Recorded today</span>
                  </div>

                  <div className="bg-white dark:bg-gray-800 p-4 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm">
                    <div className="flex items-center justify-between text-gray-500 mb-2">
                      <span className="text-xs font-semibold uppercase">UAE VAT (5%) Tax</span>
                      <i data-lucide="percent" className="w-4 h-4 text-indigo-500"></i>
                    </div>
                    <div className="text-xl font-extrabold">{stats.totalVat.toFixed(2)} <span className="text-xs font-normal">AED</span></div>
                    <span className="text-[11px] text-indigo-500 font-medium">Federal Tax Payable</span>
                  </div>

                  <div className="bg-white dark:bg-gray-800 p-4 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm">
                    <div className="flex items-center justify-between text-gray-500 mb-2">
                      <span className="text-xs font-semibold uppercase">Total Bills Issued</span>
                      <i data-lucide="receipt" className="w-4 h-4 text-purple-500"></i>
                    </div>
                    <div className="text-xl font-extrabold">{stats.count}</div>
                    <span className="text-[11px] text-gray-400">Invoices saved</span>
                  </div>
                </div>

                <div className="bg-white dark:bg-gray-800 rounded-2xl border border-gray-100 dark:border-gray-700 overflow-hidden shadow-sm">
                  <div className="p-4 border-b border-gray-100 dark:border-gray-700 flex items-center justify-between">
                    <h3 className="font-bold text-sm">Recent Transactions</h3>
                    <button onClick={() => setActiveTab('invoices')} className="text-xs text-brand-600 font-semibold hover:underline">View All</button>
                  </div>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-sm">
                      <thead className="bg-gray-50 dark:bg-gray-700/50 text-xs text-gray-500 uppercase">
                        <tr>
                          <th className="p-3">Invoice #</th>
                          <th className="p-3">Customer</th>
                          <th className="p-3">Amount</th>
                          <th className="p-3">Method</th>
                          <th className="p-3">Status</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-gray-100 dark:divide-gray-700">
                        {invoices.slice(0, 5).map((inv, idx) => (
                          <tr key={idx} className="hover:bg-gray-50/50 dark:hover:bg-gray-700/30">
                            <td className="p-3 font-semibold text-brand-600">{inv.invoiceNumber}</td>
                            <td className="p-3">{inv.customer?.name}</td>
                            <td className="p-3 font-bold">{inv.grandTotal?.toFixed(2)} AED</td>
                            <td className="p-3 capitalize text-xs"><span className="bg-gray-100 dark:bg-gray-700 px-2 py-0.5 rounded">{inv.paymentMethod}</span></td>
                            <td className="p-3">
                              <span className={`text-[11px] px-2 py-0.5 rounded-full font-semibold ${
                                inv.status === 'Paid' ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'
                              }`}>
                                {inv.status}
                              </span>
                            </td>
                          </tr>
                        ))}
                        {invoices.length === 0 && (
                          <tr><td colSpan="5" className="p-6 text-center text-gray-400">No invoices created yet.</td></tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'pos' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <div className="lg:col-span-7 space-y-4">
                  <div className="flex flex-col sm:flex-row items-center justify-between gap-3">
                    <h2 className="text-xl font-bold">Select Items</h2>
                    <div className="relative w-full sm:w-64">
                      <i data-lucide="search" className="w-4 h-4 absolute left-3 top-3 text-gray-400"></i>
                      <input
                        type="text"
                        placeholder="Search product..."
                        value={searchProduct}
                        onChange={(e) => setSearchProduct(e.target.value)}
                        className="w-full pl-9 pr-3 py-2 text-sm bg-white dark:bg-gray-800 border rounded-xl"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 max-h-[calc(100vh-220px)] overflow-y-auto pr-1">
                    {products
                      .filter(p => p.name.toLowerCase().includes(searchProduct.toLowerCase()) || p.code.toLowerCase().includes(searchProduct.toLowerCase()))
                      .map(product => (
                        <div
                          key={product.id}
                          onClick={() => addToCart(product)}
                          className="bg-white dark:bg-gray-800 p-3 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm hover:border-brand-500 cursor-pointer transition-all flex flex-col justify-between group">
                          <div>
                            <div className="flex items-center justify-between mb-1">
                              <span className="text-[10px] font-bold text-gray-400">{product.code}</span>
                              <span className={`text-[10px] font-bold px-1.5 py-0.2 rounded ${
                                product.stock > 10 ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'
                              }`}>
                                {product.stock} left
                              </span>
                            </div>
                            <h4 className="font-semibold text-xs line-clamp-2 group-hover:text-brand-600">{product.name}</h4>
                          </div>
                          <div className="mt-3 flex items-center justify-between pt-2 border-t border-gray-50 dark:border-gray-700">
                            <span className="text-sm font-bold">{product.price.toFixed(2)} <span className="text-[10px] font-normal">AED</span></span>
                            <span className="w-6 h-6 rounded-lg bg-brand-50 text-brand-600 flex items-center justify-center font-bold text-xs">+</span>
                          </div>
                        </div>
                    ))}
                  </div>
                </div>

                <div className="lg:col-span-5 bg-white dark:bg-gray-800 rounded-2xl border border-gray-100 dark:border-gray-700 p-4 flex flex-col justify-between shadow-md">
                  <div>
                    <div className="mb-4 space-y-2">
                      <label className="text-xs font-bold text-gray-500 uppercase">Customer Information</label>
                      <select
                        value={selectedCustomer.id}
                        onChange={(e) => setSelectedCustomer(customers.find(c => c.id === e.target.value))}
                        className="w-full p-2 text-sm bg-gray-50 dark:bg-gray-700 border rounded-xl">
                        {customers.map(c => (
                          <option key={c.id} value={c.id}>{c.name} {c.trn !== 'N/A' ? `(TRN: ${c.trn})` : ''}</option>
                        ))}
                      </select>
                    </div>

                    <div className="border-t border-b border-gray-100 dark:border-gray-700 my-3 py-2 space-y-2 max-h-56 overflow-y-auto">
                      {cart.length === 0 && (
                        <div className="py-8 text-center text-gray-400 text-xs">No items added yet.</div>
                      )}
                      {cart.map(item => (
                        <div key={item.id} className="flex items-center justify-between text-xs py-1">
                          <div className="flex-1 pr-2">
                            <h5 className="font-bold line-clamp-1">{item.name}</h5>
                            <span className="text-gray-400">{item.price.toFixed(2)} AED x {item.qty}</span>
                          </div>
                          <div className="flex items-center space-x-2">
                            <button onClick={() => updateCartQty(item.id, item.qty - 1)} className="w-6 h-6 rounded bg-gray-100 dark:bg-gray-700 font-bold">-</button>
                            <span className="font-bold w-4 text-center">{item.qty}</span>
                            <button onClick={() => updateCartQty(item.id, item.qty + 1)} className="w-6 h-6 rounded bg-gray-100 dark:bg-gray-700 font-bold">+</button>
                            <span className="font-bold w-14 text-right">{(item.price * item.qty).toFixed(2)}</span>
                          </div>
                        </div>
                      ))}
                    </div>

                    <div className="space-y-3 pt-2">
                      <div className="flex items-center space-x-2">
                        <label className="text-xs font-semibold text-gray-500 w-20">Discount:</label>
                        <input
                          type="number"
                          min="0"
                          value={discount}
                          onChange={(e) => setDiscount(parseFloat(e.target.value) || 0)}
                          className="w-full p-1.5 text-xs bg-gray-50 dark:bg-gray-700 border rounded-lg"
                        />
                        <select
                          value={discountType}
                          onChange={(e) => setDiscountType(e.target.value)}
                          className="p-1.5 text-xs bg-gray-50 dark:bg-gray-700 border rounded-lg">
                          <option value="amount">AED</option>
                          <option value="percent">%</option>
                        </select>
                      </div>

                      <div className="flex items-center space-x-2">
                        <label className="text-xs font-semibold text-gray-500 w-20">Payment:</label>
                        <div className="grid grid-cols-3 gap-1 w-full">
                          {['cash', 'card', 'bank'].map(m => (
                            <button
                              key={m}
                              onClick={() => setPaymentMethod(m)}
                              className={`py-1 text-[11px] font-bold rounded-lg border capitalize ${
                                paymentMethod === m ? 'bg-brand-600 text-white border-brand-600' : 'bg-gray-50 dark:bg-gray-700'
                              }`}>
                              {m}
                            </button>
                          ))}
                        </div>
                      </div>
                    </div>
                  </div>

                  <div className="mt-4 pt-3 border-t border-gray-200 dark:border-gray-700 space-y-1.5 text-xs">
                    <div className="flex justify-between text-gray-500">
                      <span>Subtotal:</span>
                      <span>{cartCalculations.subtotal.toFixed(2)} AED</span>
                    </div>
                    {cartCalculations.discAmount > 0 && (
                      <div className="flex justify-between text-red-500">
                        <span>Discount:</span>
                        <span>-{cartCalculations.discAmount.toFixed(2)} AED</span>
                      </div>
                    )}
                    <div className="flex justify-between text-gray-500">
                      <span>UAE VAT ({company.vatPercent}%):</span>
                      <span>{cartCalculations.vatTotal.toFixed(2)} AED</span>
                    </div>
                    <div className="flex justify-between text-base font-extrabold text-brand-600 pt-2 border-t">
                      <span>Grand Total:</span>
                      <span>{cartCalculations.grandTotal.toFixed(2)} AED</span>
                    </div>

                    <button
                      onClick={handleCheckout}
                      className="w-full mt-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg flex items-center justify-center space-x-2">
                      <i data-lucide="check-circle" className="w-5 h-5"></i>
                      <span>Generate & Save Invoice</span>
                    </button>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'invoices' && (
              <div className="space-y-4">
                <div className="flex flex-col sm:flex-row items-center justify-between gap-3">
                  <h2 className="text-xl font-bold">Invoices & Receipts</h2>
                  <input
                    type="text"
                    placeholder="Search invoice or customer..."
                    value={searchInvoice}
                    onChange={(e) => setSearchInvoice(e.target.value)}
                    className="p-2 text-sm bg-white dark:bg-gray-800 border rounded-xl w-full sm:w-64"
                  />
                </div>

                <div className="bg-white dark:bg-gray-800 rounded-2xl border border-gray-100 dark:border-gray-700 overflow-hidden shadow-sm">
                  <table className="w-full text-left text-sm">
                    <thead className="bg-gray-50 dark:bg-gray-700/50 text-xs text-gray-500 uppercase">
                      <tr>
                        <th className="p-3">Invoice #</th>
                        <th className="p-3">Date</th>
                        <th className="p-3">Customer</th>
                        <th className="p-3">VAT (5%)</th>
                        <th className="p-3">Grand Total</th>
                        <th className="p-3">Status</th>
                        <th className="p-3 text-right">Actions</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-gray-100 dark:divide-gray-700">
                      {invoices
                        .filter(i => i.invoiceNumber?.toLowerCase().includes(searchInvoice.toLowerCase()) || i.customer?.name?.toLowerCase().includes(searchInvoice.toLowerCase()))
                        .map((inv, idx) => (
                          <tr key={idx} className="hover:bg-gray-50/50 dark:hover:bg-gray-700/30">
                            <td className="p-3 font-bold text-brand-600">{inv.invoiceNumber}</td>
                            <td className="p-3 text-xs">{new Date(inv.date).toLocaleDateString()}</td>
                            <td className="p-3 font-medium">{inv.customer?.name}</td>
                            <td className="p-3">{inv.vatAmount?.toFixed(2)} AED</td>
                            <td className="p-3 font-extrabold">{inv.grandTotal?.toFixed(2)} AED</td>
                            <td className="p-3">
                              <span className={`text-[11px] px-2 py-0.5 rounded-full font-bold ${
                                inv.status === 'Paid' ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'
                              }`}>
                                {inv.status}
                              </span>
                            </td>
                            <td className="p-3 text-right space-x-2">
                              <button
                                onClick={() => { setActiveInvoice(inv); setShowPrintModal(true); }}
                                className="p-1.5 bg-gray-100 dark:bg-gray-700 rounded-lg">
                                <i data-lucide="printer" className="w-4 h-4"></i>
                              </button>
                            </td>
                          </tr>
                        ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {activeTab === 'products' && (
              <div className="space-y-4">
                <div className="flex items-center justify-between">
                  <h2 className="text-xl font-bold">Product Stock</h2>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {products.map(p => (
                    <div key={p.id} className="bg-white dark:bg-gray-800 p-4 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm flex items-center justify-between">
                      <div>
                        <span className="text-[10px] font-bold text-gray-400">{p.code}</span>
                        <h4 className="font-bold text-sm">{p.name}</h4>
                        <div className="text-xs text-gray-500 mt-1">{p.price.toFixed(2)} AED</div>
                      </div>
                      <span className="text-xs font-bold px-2 py-1 bg-emerald-100 text-emerald-800 rounded-lg">{p.stock} In Stock</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'customers' && (
              <div className="space-y-4">
                <h2 className="text-xl font-bold">Customer Directory</h2>
                <div className="bg-white dark:bg-gray-800 rounded-2xl border border-gray-100 dark:border-gray-700 overflow-hidden shadow-sm">
                  <table className="w-full text-left text-sm">
                    <thead className="bg-gray-50 dark:bg-gray-700/50 text-xs text-gray-500 uppercase">
                      <tr>
                        <th className="p-3">Name</th>
                        <th className="p-3">TRN</th>
                        <th className="p-3">Phone</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-gray-100 dark:divide-gray-700">
                      {customers.map(c => (
                        <tr key={c.id}>
                          <td className="p-3 font-bold">{c.name}</td>
                          <td className="p-3 font-mono text-xs">{c.trn}</td>
                          <td className="p-3 text-xs">{c.phone}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {activeTab === 'reports' && (
              <div className="space-y-6">
                <h2 className="text-xl font-bold">Company Info</h2>
                <div className="bg-white dark:bg-gray-800 p-6 rounded-2xl border border-gray-100 dark:border-gray-700 space-y-3 text-xs max-w-lg">
                  <div>
                    <label className="font-semibold text-gray-500">Company Name</label>
                    <input type="text" value={company.name} onChange={(e) => setCompany({ ...company, name: e.target.value })} className="w-full p-2 bg-gray-50 dark:bg-gray-700 border rounded-lg mt-1" />
                  </div>
                  <div>
                    <label className="font-semibold text-gray-500">UAE TRN Number</label>
                    <input type="text" value={company.trn} onChange={(e) => setCompany({ ...company, trn: e.target.value })} className="w-full p-2 bg-gray-50 dark:bg-gray-700 border rounded-lg mt-1 font-mono" />
                  </div>
                </div>
              </div>
            )}
          </main>

          {showPrintModal && activeInvoice && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 text-black">
                <div id="printable-area" className="p-2 text-xs space-y-4">
                  <div className="text-center border-b pb-3">
                    <h2 className="text-xl font-extrabold">TAX INVOICE</h2>
                    <p className="font-bold">{activeInvoice.company?.name}</p>
                    <p className="font-mono">TRN: {activeInvoice.company?.trn}</p>
                  </div>

                  <div className="flex justify-between border-b pb-2">
                    <div>
                      <p><strong>Invoice #:</strong> {activeInvoice.invoiceNumber}</p>
                      <p><strong>Date:</strong> {new Date(activeInvoice.date).toLocaleString()}</p>
                    </div>
                    <div>
                      <p><strong>Customer:</strong> {activeInvoice.customer?.name}</p>
                    </div>
                  </div>

                  <table className="w-full text-left">
                    <thead>
                      <tr className="border-b bg-gray-50">
                        <th className="py-1">Item</th>
                        <th className="py-1 text-center">Qty</th>
                        <th className="py-1 text-right">Price</th>
                        <th className="py-1 text-right">Total</th>
                      </tr>
                    </thead>
                    <tbody>
                      {activeInvoice.items?.map((item, idx) => (
                        <tr key={idx} className="border-b">
                          <td className="py-1">{item.name}</td>
                          <td className="py-1 text-center">{item.qty}</td>
                          <td className="py-1 text-right">{item.price.toFixed(2)}</td>
                          <td className="py-1 text-right">{(item.price * item.qty).toFixed(2)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>

                  <div className="border-t pt-2 space-y-1 text-right">
                    <div className="flex justify-between">
                      <span>VAT (5%):</span>
                      <span>{activeInvoice.vatAmount?.toFixed(2)} AED</span>
                    </div>
                    <div className="flex justify-between font-extrabold text-sm border-t pt-1">
                      <span>Grand Total:</span>
                      <span>{activeInvoice.grandTotal?.toFixed(2)} AED</span>
                    </div>
                  </div>
                </div>

                <div className="no-print mt-6 flex justify-end space-x-2">
                  <button onClick={() => setShowPrintModal(false)} className="px-4 py-2 bg-gray-200 rounded-xl text-xs font-bold">Close</button>
                  <button onClick={() => window.print()} className="px-4 py-2 bg-brand-600 text-white rounded-xl text-xs font-bold">Print Invoice</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
