<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Invoicify - UAE Billing & Inventory System</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0284c7',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase Compatibility Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    @media print {
      body * { visibility: hidden; }
      #printable-area, #printable-area * { visibility: visible; }
      #printable-area {
        position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 12px;
        color: #000 !important; background: #fff !important;
      }
      .no-print { display: none !important; }
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Firebase Configuration for tharavad336
    const firebaseConfig = {
      apiKey: "AIzaSyDc113ArrZa-bBCvKl-3UEwi4pIAdtwmIA",
      authDomain: "tharavad336.firebaseapp.com",
      projectId: "tharavad336",
      storageBucket: "tharavad336.firebasestorage.app",
      messagingSenderId: "124534840254",
      appId: "1:124534840254:web:825d9c694eea1934d977ef",
      measurementId: "G-XZ92F73DVT"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    const INITIAL_PRODUCTS = [
      { id: 'p1', name: 'Premium Coffee Beans (1kg)', code: 'PRD-01', price: 85.00, vatRate: 5, stock: 42, category: 'Beverages' },
      { id: 'p2', name: 'Organic Almond Milk 1L', code: 'PRD-02', price: 18.50, vatRate: 5, stock: 15, category: 'Beverages' },
      { id: 'p3', name: 'Espresso Machine Cleaning Powder', code: 'PRD-03', price: 45.00, vatRate: 5, stock: 8, category: 'Maintenance' },
      { id: 'p4', name: 'Takeaway Cup 12oz (Pack of 50)', code: 'PRD-04', price: 32.00, vatRate: 5, stock: 120, category: 'Packaging' },
    ];

    const INITIAL_CUSTOMERS = [
      { id: 'c1', name: 'Al Maskoor Trading LLC', phone: '+971 50 123 4567', email: 'billing@almaskoor.ae', trn: '100239482700003', address: 'Business Bay, Dubai' },
      { id: 'c2', name: 'Walk-in Customer', phone: 'N/A', email: 'N/A', trn: 'N/A', address: 'Abu Dhabi, UAE' }
    ];

    function App() {
      const [theme, setTheme] = useState(localStorage.getItem('theme') || 'light');
      const [activeTab, setActiveTab] = useState('dashboard');
      const [syncStatus, setSyncStatus] = useState('Connecting...');

      const [company, setCompany] = useState({
        name: 'FLOURISH CAFE & TRADING LLC',
        trn: '100392817400003',
        phone: '+971 4 888 9999',
        email: 'info@flourish.ae',
        address: 'Sheikh Zayed Road, Dubai, UAE',
        currency: 'AED',
        vatPercent: 5
      });

      const [products, setProducts] = useState(() => {
        const local = localStorage.getItem('inv_products');
        return local ? JSON.parse(local) : INITIAL_PRODUCTS;
      });
      const [customers, setCustomers] = useState(() => {
        const local = localStorage.getItem('inv_customers');
        return local ? JSON.parse(local) : INITIAL_CUSTOMERS;
      });
      const [invoices, setInvoices] = useState(() => {
        const local = localStorage.getItem('inv_invoices');
        return local ? JSON.parse(local) : [];
      });

      const [cart, setCart] = useState([]);
      const [selectedCustomer, setSelectedCustomer] = useState(INITIAL_CUSTOMERS[1]);
      const [discount, setDiscount] = useState(0);
      const [discountType, setDiscountType] = useState('amount');
      const [paymentMethod, setPaymentMethod] = useState('cash');
      const [searchProduct, setSearchProduct] = useState('');

      const [activeInvoice, setActiveInvoice] = useState(null);
      const [showPrintModal, setShowPrintModal] = useState(false);
      const [searchInvoice, setSearchInvoice] = useState('');

      useEffect(() => {
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        localStorage.setItem('theme', theme);
      }, [theme]);

      // Direct Firebase Listener - No Auth Required
      useEffect(() => {
        const unsubscribe = db.collection('invoices').onSnapshot(
          (snapshot) => {
            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            if (data.length > 0) {
              setInvoices(data);
              localStorage.setItem('inv_invoices', JSON.stringify(data));
            }
            setSyncStatus('Cloud Connected');
          },
          (err) => {
            console.error("Firebase Error:", err);
            setSyncStatus('Offline Mode (Local Storage)');
          }
        );

        return () => unsubscribe();
      }, []);

      useEffect(() => { localStorage.setItem('inv_products', JSON.stringify(products)); }, [products]);
      useEffect(() => { localStorage.setItem('inv_customers', JSON.stringify(customers)); }, [customers]);
      useEffect(() => { localStorage.setItem('inv_invoices', JSON.stringify(invoices)); }, [invoices]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      const cartCalculations = useMemo(() => {
        const subtotal = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
        let discAmount = 0;
        if (discountType === 'amount') {
          discAmount = Math.min(discount, subtotal);
        } else {
          discAmount = (subtotal * Math.min(discount, 100)) / 100;
        }
        const netTaxable = Math.max(0, subtotal - discAmount);
        const vatTotal = netTaxable * (company.vatPercent / 100);
        const grandTotal = netTaxable + vatTotal;

        return { subtotal, discAmount, netTaxable, vatTotal, grandTotal };
      }, [cart, discount, discountType, company.vatPercent]);

      const addToCart = (product) => {
        if (product.stock <= 0) {
          alert('Warning: Product is out of stock!');
          return;
        }
        const existing = cart.find(i => i.id === product.id);
        if (existing) {
          if (existing.qty >= product.stock) {
            alert(`Stock limit (${product.stock}) reached.`);
            return;
          }
          setCart(cart.map(i => i.id === product.id ? { ...i, qty: i.qty + 1 } : i));
        } else {
          setCart([...cart, { ...product, qty: 1 }]);
        }
      };

      const updateCartQty = (id, newQty) => {
        const prod = products.find(p => p.id === id);
        if (newQty > prod.stock) {
          alert(`Stock limit reached! Max available: ${prod.stock}`);
          return;
        }
        if (newQty <= 0) {
          setCart(cart.filter(i => i.id !== id));
        } else {
          setCart(cart.map(i => i.id === id ? { ...i, qty: newQty } : i));
        }
      };

      const handleCheckout = async () => {
        if (cart.length === 0) {
          alert("Please add items to invoice before checking out.");
          return;
        }

        const invoiceNum = `INV-${new Date().getFullYear()}-${String(invoices.length + 1).padStart(4, '0')}`;
        const newInvoice = {
          invoiceNumber: invoiceNum,
          date: new Date().toISOString(),
          customer: selectedCustomer,
          items: cart,
          company: company,
          subtotal: cartCalculations.subtotal,
          discount: cartCalculations.discAmount,
          taxableAmount: cartCalculations.netTaxable,
          vatAmount: cartCalculations.vatTotal,
          vatRate: company.vatPercent,
          grandTotal: cartCalculations.grandTotal,
          paymentMethod: paymentMethod,
          status: 'Paid'
        };

        const updatedProducts = products.map(p => {
          const cartItem = cart.find(c => c.id === p.id);
          if (cartItem) {
            return { ...p, stock: p.stock - cartItem.qty };
          }
          return p;
        });

        setProducts(updatedProducts);
        const updatedInvoices = [newInvoice, ...invoices];
        setInvoices(updatedInvoices);

        // Save directly to Firebase Cloud
        try {
          await db.collection('invoices').add(newInvoice);
          console.log("Saved to Cloud!");
        } catch (e) {
          console.error("Save to Cloud failed:", e);
        }

        setCart([]);
        setDiscount(0);
        setActiveInvoice(newInvoice);
        setShowPrintModal(true);
      };

      const stats = useMemo(() => {
        const todayStr = new Date().toISOString().split('T')[0];
        const activeInvoices = invoices.filter(i => i.status !== 'Returned');

        const totalRevenue = activeInvoices.reduce((a, b) => a + (b.grandTotal || 0), 0);
        const totalVat = activeInvoices.reduce((a, b) => a + (b.vatAmount || 0), 0);
        const todaySales = activeInvoices
          .filter(i => i.date && i.date.startsWith(todayStr))
          .reduce((a, b) => a + (b.grandTotal || 0), 0);

        return { totalRevenue, totalVat, todaySales, count: activeInvoices.length };
      }, [invoices]);

      return (
        <div className="flex flex-col md:flex-row min-h-screen">
          <aside className="no-print bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 w-full md:w-64 flex-shrink-0 flex flex-col justify-between">
            <div>
              <div className="p-4 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between">
                <div className="flex items-center space-x-3">
                  <div className="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white font-bold text-lg shadow-md">
                    🇦🇪
                  </div>
                  <div>
                    <h1 className="font-bold text-sm leading-tight line-clamp-1">{company.name}</h1>
                    <span className="text-xs text-gray-500">TRN: {company.trn}</span>
                  </div>
                </div>
                <button 
                  onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
                  className="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300">
                  <i data-lucide={theme === 'dark' ? 'sun' : 'moon'} className="w-4 h-4"></i>
                </button>
              </div>

              <nav className="p-3 space-y-1">
                {[
                  { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
                  { id: 'pos', label: 'Create Invoice', icon: 'file-text' },
                  { id: 'invoices', label: 'Invoices & Bills', icon: 'receipt' },
                  { id: 'products', label: 'Products & Stock', icon: 'package' },
                  { id: 'customers', label: 'Customers', icon: 'users' },
                  { id: 'reports', label: 'Reports & Settings', icon: 'bar-chart-3' },
                ].map(nav => (
                  <button
                    key={nav.id}
                    onClick={() => setActiveTab(nav.id)}
                    className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg font-medium text-sm transition-all ${
                      activeTab === nav.id 
                        ? 'bg-brand-600 text-white shadow-md' 
                        : 'text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700/50'
                    }`}>
                    <i data-lucide={nav.icon} className="w-4 h-4"></i>
                    <span>{nav.label}</span>
                  </button>
                ))}
              </nav>
            </div>

            <div className="p-3 border-t text-xs">
              <div className="flex items-center space-x-2">
                <span className={`w-2.5 h-2.5 rounded-full ${syncStatus === 'Cloud Connected' ? 'bg-emerald-500 animate-pulse' : 'bg-amber-500'}`}></span>
                <span className="font-semibold">{syncStatus}</span>
              </div>
            </div>
          </aside>

          <main className="flex-1 overflow-y-auto p-4 md:p-6 mb-16 md:mb-0">
            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                <div className="flex items-center justify-between">
                  <h2 className="text-2xl font-bold">Sales & Revenue Dashboard</h2>
                  <button onClick={() => setActiveTab('pos')} className="bg-brand-600 text-white px-4 py-2 rounded-xl text-sm font-semibold flex items-center space-x-2">
                    <i data-lucide="plus" className="w-4 h-4"></i>
                    <span>New Bill</span>
                  </button>
                </div>

                <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                  <div className="bg-white dark:bg-gray-800 p-4 rounded-2xl border shadow-sm">
                    <span className="text-xs font-semibold text-gray-500 uppercase">Total Revenue</span>
                    <div className="text-xl font-extrabold mt-1">{stats.totalRevenue.toFixed(2)} AED</div>
                  </div>
                  <div className="bg-white dark:bg-gray-800 p-4 rounded-2xl border shadow-sm">
                    <span className="text-xs font-semibold text-gray-500 uppercase">Today's Sales</span>
                    <div className="text-xl font-extrabold mt-1">{stats.todaySales.toFixed(2)} AED</div>
                  </div>
                  <div className="bg-white dark:bg-gray-800 p-4 rounded-2xl border shadow-sm">
                    <span className="text-xs font-semibold text-gray-500 uppercase">UAE VAT (5%)</span>
                    <div className="text-xl font-extrabold mt-1">{stats.totalVat.toFixed(2)} AED</div>
                  </div>
                  <div className="bg-white dark:bg-gray-800 p-4 rounded-2xl border shadow-sm">
                    <span className="text-xs font-semibold text-gray-500 uppercase">Total Bills</span>
                    <div className="text-xl font-extrabold mt-1">{stats.count}</div>
                  </div>
                </div>

                <div className="bg-white dark:bg-gray-800 rounded-2xl border overflow-hidden shadow-sm">
                  <div className="p-4 border-b font-bold text-sm">Recent Invoices</div>
                  <table className="w-full text-left text-sm">
                    <thead className="bg-gray-50 dark:bg-gray-700/50 text-xs text-gray-500 uppercase">
                      <tr>
                        <th className="p-3">Invoice #</th>
                        <th className="p-3">Customer</th>
                        <th className="p-3">Amount</th>
                        <th className="p-3">Status</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y">
                      {invoices.slice(0, 5).map((inv, idx) => (
                        <tr key={idx}>
                          <td className="p-3 font-semibold text-brand-600">{inv.invoiceNumber}</td>
                          <td className="p-3">{inv.customer?.name}</td>
                          <td className="p-3 font-bold">{inv.grandTotal?.toFixed(2)} AED</td>
                          <td className="p-3"><span className="text-xs px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 font-bold">{inv.status}</span></td>
                        </tr>
                      ))}
                      {invoices.length === 0 && (
                        <tr><td colSpan="4" className="p-6 text-center text-gray-400">No invoices generated yet.</td></tr>
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {activeTab === 'pos' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <div className="lg:col-span-7 space-y-4">
                  <h2 className="text-xl font-bold">Select Products</h2>
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                    {products.map(product => (
                      <div key={product.id} onClick={() => addToCart(product)} className="bg-white dark:bg-gray-800 p-3 rounded-2xl border hover:border-brand-500 cursor-pointer shadow-sm">
                        <span className="text-[10px] text-gray-400 font-bold">{product.code}</span>
                        <h4 className="font-semibold text-xs">{product.name}</h4>
                        <div className="mt-2 font-bold text-sm">{product.price.toFixed(2)} AED</div>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="lg:col-span-5 bg-white dark:bg-gray-800 rounded-2xl border p-4 shadow-md flex flex-col justify-between">
                  <div>
                    <h3 className="font-bold text-sm mb-2">Invoice Summary</h3>
                    <select value={selectedCustomer.id} onChange={(e) => setSelectedCustomer(customers.find(c => c.id === e.target.value))} className="w-full p-2 text-sm bg-gray-50 dark:bg-gray-700 border rounded-xl mb-3">
                      {customers.map(c => (<option key={c.id} value={c.id}>{c.name}</option>))}
                    </select>

                    <div className="space-y-2 max-h-48 overflow-y-auto border-t border-b py-2">
                      {cart.map(item => (
                        <div key={item.id} className="flex justify-between text-xs">
                          <div>{item.name} x {item.qty}</div>
                          <div className="font-bold">{(item.price * item.qty).toFixed(2)} AED</div>
                        </div>
                      ))}
                      {cart.length === 0 && <div className="text-xs text-gray-400 text-center py-4">Cart is empty</div>}
                    </div>
                  </div>

                  <div className="pt-3 border-t space-y-2 text-xs">
                    <div className="flex justify-between"><span>Subtotal:</span><span>{cartCalculations.subtotal.toFixed(2)} AED</span></div>
                    <div className="flex justify-between"><span>VAT (5%):</span><span>{cartCalculations.vatTotal.toFixed(2)} AED</span></div>
                    <div className="flex justify-between font-extrabold text-base text-brand-600"><span>Total:</span><span>{cartCalculations.grandTotal.toFixed(2)} AED</span></div>
                    
                    <button onClick={handleCheckout} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow mt-2">
                      Generate & Save Invoice
                    </button>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'invoices' && (
              <div className="space-y-4">
                <h2 className="text-xl font-bold">All Saved Invoices</h2>
                <div className="bg-white dark:bg-gray-800 rounded-2xl border overflow-hidden">
                  <table className="w-full text-left text-sm">
                    <thead className="bg-gray-50 dark:bg-gray-700/50 text-xs text-gray-500">
                      <tr>
                        <th className="p-3">Invoice #</th>
                        <th className="p-3">Date</th>
                        <th className="p-3">Customer</th>
                        <th className="p-3">Grand Total</th>
                        <th className="p-3">Print</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y">
                      {invoices.map((inv, idx) => (
                        <tr key={idx}>
                          <td className="p-3 font-bold text-brand-600">{inv.invoiceNumber}</td>
                          <td className="p-3 text-xs">{new Date(inv.date).toLocaleDateString()}</td>
                          <td className="p-3">{inv.customer?.name}</td>
                          <td className="p-3 font-bold">{inv.grandTotal?.toFixed(2)} AED</td>
                          <td className="p-3">
                            <button onClick={() => { setActiveInvoice(inv); setShowPrintModal(true); }} className="p-1 bg-gray-100 rounded">
                              <i data-lucide="printer" className="w-4 h-4"></i>
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {activeTab === 'products' && (
              <div className="space-y-4">
                <h2 className="text-xl font-bold">Products & Inventory</h2>
                <div className="grid grid-cols-2 gap-4">
                  {products.map(p => (
                    <div key={p.id} className="bg-white dark:bg-gray-800 p-4 rounded-xl border flex justify-between">
                      <div>
                        <h4 className="font-bold text-sm">{p.name}</h4>
                        <span className="text-xs text-gray-500">{p.price.toFixed(2)} AED</span>
                      </div>
                      <span className="font-bold text-xs bg-emerald-100 text-emerald-800 p-2 rounded-lg h-fit">{p.stock} Stock</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'customers' && (
              <div className="space-y-4">
                <h2 className="text-xl font-bold">Customers</h2>
                <div className="bg-white dark:bg-gray-800 rounded-xl border p-4 space-y-2">
                  {customers.map(c => (
                    <div key={c.id} className="flex justify-between text-sm border-b pb-2">
                      <span className="font-bold">{c.name}</span>
                      <span className="text-xs text-gray-500">TRN: {c.trn}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'reports' && (
              <div className="space-y-4">
                <h2 className="text-xl font-bold">Company Profile</h2>
                <div className="bg-white dark:bg-gray-800 p-4 rounded-xl border max-w-md space-y-2 text-xs">
                  <div>Name: <strong>{company.name}</strong></div>
                  <div>TRN: <strong>{company.trn}</strong></div>
                  <div>Address: <strong>{company.address}</strong></div>
                </div>
              </div>
            )}
          </main>

          {showPrintModal && activeInvoice && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
              <div className="bg-white p-6 rounded-2xl max-w-sm w-full text-black">
                <div id="printable-area" className="text-xs space-y-3">
                  <div className="text-center border-b pb-2">
                    <h3 className="font-extrabold text-base">TAX INVOICE</h3>
                    <p className="font-bold">{activeInvoice.company?.name}</p>
                    <p>TRN: {activeInvoice.company?.trn}</p>
                  </div>
                  <div>
                    <div><strong>Inv #:</strong> {activeInvoice.invoiceNumber}</div>
                    <div><strong>Customer:</strong> {activeInvoice.customer?.name}</div>
                  </div>
                  <table className="w-full text-left border-t border-b">
                    <thead>
                      <tr><th className="py-1">Item</th><th className="py-1">Qty</th><th className="py-1 text-right">Total</th></tr>
                    </thead>
                    <tbody>
                      {activeInvoice.items?.map((item, idx) => (
                        <tr key={idx}>
                          <td className="py-1">{item.name}</td>
                          <td className="py-1">{item.qty}</td>
                          <td className="py-1 text-right">{(item.price * item.qty).toFixed(2)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                  <div className="text-right font-bold text-sm">
                    Grand Total: {activeInvoice.grandTotal?.toFixed(2)} AED
                  </div>
                </div>
                <div className="no-print flex justify-end space-x-2 mt-4">
                  <button onClick={() => setShowPrintModal(false)} className="px-3 py-1 bg-gray-200 rounded text-xs">Close</button>
                  <button onClick={() => window.print()} className="px-3 py-1 bg-brand-600 text-white rounded text-xs font-bold">Print</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
